function buildReminders() {
  const out = [], now = Date.now(), today = isoDate(new Date());
  const add = (id, t, title, body, url = "./") => { if (t > now && t < now + 9 * DAY) out.push({ id, at: t, title, body, url }); };
  // Séances de salle prévues cette semaine : la veille à 20 h
  try { const wi = weekInfo(); if (wi && !wi.over) { const P = planWeek(wi);
    for (const [d, k] of Object.entries(P.plan)) if (d > today) add(`gym-${d}-${k}`, at(plusDays(d, -1), "20:00"), `Demain : séance ${k}`, `${SESS_TXT[k][0].toUpperCase() + SESS_TXT[k].slice(1)}. Prépare ton sac !`, `./#seance-${k.toLowerCase()}`);
  } } catch (e) {}
  // Padel : avant-match, veille de tournoi, journal
  for (let i = -1; i <= 8; i++) {
    const d = plusDays(today, i);
    for (const p of padelOn(d)) {
      if (p.type !== "match" && p.type !== "tournoi") continue;
      if (p.type === "tournoi") add(`tour-${d}`, at(plusDays(d, -1), "20:00"), "Tournoi demain 🏆", "Pas de séance jambes aujourd'hui, bois bien et couche-toi tôt.", "./#competition");
      const start = p.time ? at(d, p.time) : at(d, p.type === "tournoi" ? "08:00" : "18:00");
      if (p.time) add(`pre-${d}-${p.id}`, start - 75 * 60000, `${p.type === "tournoi" ? "Tournoi" : "Match"} à ${p.time.replace(":", "h")}`, "En arrivant, lance l'échauffement avant-match (8 min).", "./#accueil");
      if (!(S.journal || []).some(j => j.date === d)) {
        const endT = p.time ? start + ((+p.dur || 90) + 90) * 60000 : at(plusDays(d, 1), "12:00");
        add(`note-${d}`, Math.min(endT, at(d, "22:30")) > start ? Math.min(endT, at(d, "22:30")) : at(plusDays(d, 1), "12:00"), "Note ton match 📝", "30 secondes : ce qui a marché, ce qui a coincé.", "./#journal");
      }
    }
  }
  // Pesée : lundi 8 h
  const nextMon = (() => { let d = isoDate(mondayOf(new Date())); if (weekWeight() || now >= at(d, "08:00")) d = plusDays(d, 7); return d; })();
  add(`weigh-${nextMon}`, at(nextMon, "08:00"), "Pesée de la semaine ⚖️", "Le matin à jeun, après être passé aux toilettes.", "./#tests");
  // Séance maison : jeudi 18 h 30 si l'objectif de la semaine n'est pas atteint
  const thu = plusDays(isoDate(mondayOf(new Date())), 3);
  if (homeThisWeek() < HOME_TARGET) add(`home-${thu}`, at(thu, "18:30"), "Séance M ce soir ?", `${homeThisWeek()}/${HOME_TARGET} cette semaine. 20 min à la maison pour tes appuis.`, "./#seance-m");
  // Hydratation : toutes les X h dans la plage choisie ; aujourd'hui, plus rien une fois l'objectif atteint
  const h = H(), gym = gymDaySet();
  if (h.hydra) {
    const [fh, fm] = h.hFrom.split(":").map(Number), [th, tm] = h.hTo.split(":").map(Number);
    const step = Math.round((+h.hEvery || 2) * 60), MSG = ["Un grand verre d'eau 💧", "Petite pause eau 💧", "Pense à ta gourde 💧", "Hydrate tes muscles 💧"];
    for (let i = 0; i <= 8; i++) {
      const d = plusDays(today, i), g = waterGoalFor(d, gym), k = dayKind(d, gym);
      if (i === 0 && waterOf(d) >= g) continue;
      const extra = k === "tournoi" ? " (jour de tournoi)" : k === "actif" ? " (jour d'entraînement)" : "";
      for (let m = fh * 60 + fm, n = 0; m <= th * 60 + tm; m += step, n++) {
        const hm = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
        add(`eau-${d}-${hm}`, at(d, hm), MSG[n % MSG.length], `Objectif du jour : ${litres(g)}${extra}. Note tes verres dans l'appli.`, "./#accueil");
      }
    }
  }
  // Étirements & motricité : après le padel, et les soirs sans salle ni padel (cette semaine)
  if (h.stretch) {
    const sun = plusDays(isoDate(mondayOf(new Date())), 6);
    for (let i = 0; i <= 8; i++) {
      const d = plusDays(today, i), pad = padelOn(d);
      for (const p of pad) if (p.type !== "tournoi" && p.time) add(`etir-${d}-${p.id}`, at(d, p.time) + ((+p.dur || 90) + 20) * 60000, "Étirements après le padel 🧘", "8 min de récup guidée : bouton « Récup après » dans l'appli.", "./#accueil");
      if (d > sun || pad.length || gym.has(d) || homeOn(d) || out.some(x => x.id === `home-${d}`)) continue;
      add(`mob-${d}`, at(d, "20:30"), "Motricité ou étirements ce soir ? 🤸", homeThisWeek() < HOME_TARGET ? `Séance M (20 min) : ${homeThisWeek()}/${HOME_TARGET} cette semaine.` : "10 min d'étirements suffisent pour récupérer.", "./#seance-m");
    }
  }
  // Rappel de test (bouton dans Réglages) : gardé 20 min pour que la fonction le voie
  const tst = Store.lsGet("pushTest"); if (tst && tst > now - 20 * 60000) out.push({ id: "test-" + tst, at: tst, title: "Test Salle Padel 🎾", body: "Les rappels marchent !", url: "./#reglages" });
  return out.sort((a, b) => a.at - b.at);
}
const pushRef = () => Store.db.collection("sallePadel").doc(Store.user.uid).collection("push");

}

function drawRankChart() {
  const h = S.comp.history; const el = $("#c-chart"); if (!el) return;
  const W = 340, H = 150, pl = 50, pr = 12, pt = 12, pb = 24;
  const vs = h.map(x => x.rank); let lo = Math.min(...vs), hi = Math.max(...vs); if (lo === hi) { lo *= .9; hi *= 1.1; }
  const x = i => pl + (W - pl - pr) * (i / (h.length - 1)); const y = v => pt + (H - pt - pb) * ((v - lo) / (hi - lo)); // meilleur rang en haut
  const line = h.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.rank).toFixed(1)).join(" ");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du classement">
    ${[lo, hi].map(t => `<text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="${CV.muted}">${frNum(t)}</text><line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="${CV.line}"/>`).join("")}
    <path d="${line}" fill="none" stroke="${CV.ball}" stroke-width="2.5"/>
    ${h.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.rank)}" r="3" fill="${CV.ball}"/><text x="${x(i)}" y="${H - 6}" font-size="10" fill="${CV.muted}" text-anchor="middle">${monthLabel(p.month)}</text>`).join("")}
  </svg>`;
}

/* ---- Tournois partagés avec l'agenda des mimichats (foyer/main/events, champ « padel » = catégorie) */
const evCol = () => Store.db.collection("foyer").doc("main").collection("events");
const tourTitle = t => "🎾 " + t.cat + (t.name && t.name !== t.cat ? " · " + t.name : "");
function pushTournament(t, extra = {}) {
  if (Store.mode !== "db") return Promise.resolve();
  const id = t.evId || "sp-" + t.id;
  return evCol().doc(id).set({ title: tourTitle(t), date: t.date, endDate: "", time: t.time || "", endTime: "", allDay: !t.time, who: "thib", recur: "none", remind: "none",
    padel: t.cat, padelName: t.name || "", partner: t.partner || "", padelId: t.id, by: "thib", at: Date.now(), ...extra }, { merge: true })
    .then(() => { if (!t.evId) { t.evId = id; saveComp(); } }) // lien noté seulement une fois l'événement créé
    .catch(() => toast("Agenda des mimichats non mis à jour (réseau ?)"));
}
function removeTournament(t) { if (Store.mode === "db" && t.evId) evCol().doc(t.evId).delete().catch(() => {}); }
let pulling = false;
async function pullTournaments() {
  if (Store.mode !== "db" || !S.comp || pulling) return;
  pulling = true;
  try {
    const snap = await Store.withTimeout(evCol().get({ source: "server" }), 8000);
    const c = S.comp, today = isoDate(new Date()); c.upcoming = c.upcoming || []; let changed = false;
    const evs = new Map(snap.docs.filter(d => d.get("padel")).map(d => [d.id, d.data()]));
    const known = new Set([...c.upcoming, ...c.results].map(x => x.evId).filter(Boolean));
    for (const [id, e] of evs) {
      if (e.padelDone) continue;
      const name = e.padelName != null && e.title === tourTitle({ cat: e.padel, name: e.padelName }) ? e.padelName
        : String(e.title || "").replace(/^🎾\s*/, "").replace(new RegExp("^" + e.padel + "\\s*·?\\s*"), "").trim();
      const u = c.upcoming.find(x => x.evId === id);
      if (!u) { if (!known.has(id) && e.date >= plusDays(today, -3)) { c.upcoming.push({ id: "m" + Date.now() + Math.random().toString(36).slice(2, 5), evId: id, date: e.date, time: e.time || "", cat: e.padel, name, partner: e.partner || "" }); changed = true; } continue; }
      const upd = { date: e.date, time: e.time || "", cat: e.padel, name, partner: e.partner ?? u.partner };
      if (Object.keys(upd).some(k => (u[k] || "") !== (upd[k] || ""))) { Object.assign(u, upd); changed = true; }
    }
    // Supprimés dans les mimichats (ou qui ne sont plus des tournois)
    const before = c.upcoming.length;
    c.upcoming = c.upcoming.filter(x => !x.evId || evs.has(x.evId));
    if (c.upcoming.length !== before) changed = true;
    // Tournois notés avant la synchro : envoyés à l'agenda
    for (const u of c.upcoming.filter(x => !x.evId && x.date >= today)) { pushTournament(u); changed = true; }
    if (changed) { await saveComp(); const h = (location.hash || "#accueil").slice(1); if (!$("#modal").classList.contains("on") && (h === "competition" || h === "accueil")) route(); }
  } catch (e) {} finally { pulling = false; }
}

    c.results = c.results.filter(x => x.id !== item.id); c.results.push(item);

    await saveComp(); toast("Résultat enregistré");
    if (item.evId) pushTournament(item, { title: tourTitle(item) + ` : ${item.place ? item.place + "e" : "résultat"} (+${item.pts} pts)`, padelDone: true });
  });
  const hint = () => { const p = baremePts($("#r-c").value, +$("#r-pl").value, +$("#r-n").value); $("#r-hint").textContent = p != null ? "· barème : " + p : ""; if (p != null && !$("#r-pts").dataset.touched) $("#r-pts").value = p; };
  ["#r-c", "#r-n", "#r-pl"].forEach(s => $(s).oninput = hint); $("#r-pts").oninput = () => { $("#r-pts").dataset.touched = 1; };
}

const RULE_TXT = `match /sallePadel/{uid}/{document=**} {

function syncHtml() {
  if (Store.mode === "db") return `<div class="notice info small">✅ Synchro active · ${esc(Store.user.email)}. Tes séances sont sauvegardées sur ton compte et retrouvées sur tous tes appareils.</div><button class="btn ghost block" id="sy-out" type="button">Se déconnecter</button>`;

const THEME_VARS = ["--court", "--court-2", "--court-3", "--line", "--chalk", "--muted", "--ball", "--ball-ink"];
function bestRank() { const r = (S.comp?.history || []).map(h => h.rank).filter(Boolean); return r.length ? Math.min(...r) : null; }
function bestReflex() { const r = (S.extras?.reflex || []).filter(x => x.mode === "simple").map(x => x.avg); return r.length ? Math.min(...r) : null; }
function themeUnlocked(t) {
  if (t.need) { const b = bestRank(); return b != null && b <= t.need; }
  if (t.reflex) { const b = bestReflex(); return b != null && b <= t.reflex; }
  return true;
}
function applyTheme(id = S.extras?.theme) {

  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t.v[0]);

function checkUnlocks(silent) {
  if (!S.extras) return;

  const known = S.extras.unlocked || [];
  const fresh = now.filter(id => !known.includes(id));
  if (!fresh.length) return;
  S.extras.unlocked = [...known, ...fresh]; saveExtras();
  if (!silent) setTimeout(() => toast("🎨 " + (fresh.length > 1 ? "Thèmes" : "Thème") + " débloqué" + (fresh.length > 1 ? "s" : "") + " : " + fresh.map(id => THEMES.find(t => t.id === id).name).join(", ")), 300);
}

      return `<button type="button" class="th ${t.id === cur ? "on" : ""} ${ok ? "" : "locked"}" data-th="${t.id}" style="background:${v[1]};color:${v[4]}">

// ---- Carte joueur façon FIFA
const lerpPts = (v, pts) => { if (v == null) return null; if (v <= pts[0][0]) return pts[0][1]; for (let i = 1; i < pts.length; i++) if (v <= pts[i][0]) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; return y0 + (y1 - y0) * (v - x0) / (x1 - x0); } return pts[pts.length - 1][1]; };

function bindReflex() { $("#rx-s").onclick = () => startRx("simple"); $("#rx-lr").onclick = () => startRx("lr"); }
function rxShow(cls, info, big, txt, btns = "") {
  const el = $("#rx"); el.className = "rx on " + cls;
  $("#rx-info").textContent = info; $("#rx-big").innerHTML = big; $("#rx-big").classList.toggle("arrow", big === "←" || big === "→");
  $("#rx-txt").innerHTML = txt; $("#rx-btns").innerHTML = btns;
}
function startRx(mode) {
  Object.assign(RX, { mode, times: [], early: 0, miss: 0, state: "ready" });
  try { RX.lock = navigator.wakeLock?.request("screen"); } catch (e) {}
  rxShow("", mode === "lr" ? "Gauche / Droite" : "Simple", "🎾", "Touche l'écran pour commencer.<br><span class='muted small'>Attends la balle, puis touche le plus vite possible.</span>", `<button class="btn ghost" data-rx="stop" type="button">Fermer</button>`);
}
function rxProgress() { return `Essai ${Math.min(RX.times.length + 1, RX.n)}/${RX.n}`; }
