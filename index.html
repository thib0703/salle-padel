<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salle Padel</title>
<meta name="theme-color" content="#0E2236">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salle Padel">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --court: #0E2236;
  --court-2: #15314C;
  --court-3: #1D3F5F;
  --line: #2C5277;
  --chalk: #EEF3F7;
  --muted: #9DB2C6;
  --ball: #F4D13D;
  --ball-ink: #1A1A10;
  --good: #4FD39A;
  --warn: #FF9F5A;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--court); color: var(--chalk); font-family: var(--body); font-size: 16px; line-height: 1.4;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 150px); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: 34px; }
h2 { font-size: 24px; }
h3 { font-size: 19px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.week-head { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; position: relative; overflow: hidden; }
.week-head::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border: 2px solid var(--line); border-radius: 50%; opacity: .6; }
.eyebrow { font-family: var(--display); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ball); font-weight: 700; }
.big { font-family: var(--display); font-size: 52px; font-weight: 700; line-height: .9; }
.weeks { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 14px; }
.weeks span { height: 8px; border-radius: 3px; background: var(--court-3); }
.weeks span.done { background: var(--muted); }
.weeks span.now { background: var(--ball); }
.weeks span.deload { outline: 1px dashed var(--muted); outline-offset: 1px; }
.weeks-legend { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 12px; color: var(--muted); margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; background: var(--court-3); color: var(--chalk); }
.chip.ball { background: var(--ball); color: var(--ball-ink); }
.chip.good { background: rgba(79,211,154,.16); color: var(--good); }
.chip.warn { background: rgba(255,159,90,.16); color: var(--warn); }
.sess { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-decoration: none; color: inherit; }
.sess.next { border-color: var(--ball); box-shadow: 0 0 0 1px var(--ball) inset; }
.sess.skip { opacity: .55; }
.letter { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-size: 34px; font-weight: 700; background: var(--court-3); }
.sess.next .letter { background: var(--ball); color: var(--ball-ink); }
.arrow { font-size: 22px; color: var(--muted); }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 700; background: var(--court-3); color: var(--chalk); text-align: center; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--ball); color: var(--ball-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.back { color: var(--muted); text-decoration: none; font-weight: 600; }
.block-title { font-family: var(--display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 10px 0 -2px; }
.ex { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ex.complete { border-color: rgba(79,211,154,.55); }
.ex-head { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 14px 14px 10px; align-items: start; }
.ex-num { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--muted); line-height: 1.1; }
.ex.complete .ex-num { color: var(--good); }
.presc { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--ball); white-space: nowrap; text-align: right; line-height: 1.1; }
.presc small { display: block; font-family: var(--body); font-size: 12.5px; color: var(--muted); font-weight: 500; }
.ex-meta { padding: 0 14px 10px 54px; display: flex; flex-direction: column; gap: 6px; }
.last { font-size: 14px; color: var(--muted); }
.last b { color: var(--chalk); font-weight: 600; }
.hint { font-size: 14px; color: var(--good); font-weight: 600; }
details.how { border-top: 1px solid var(--line); }
details.how summary { list-style: none; padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::before { content: "+ "; color: var(--ball); }
details.how[open] summary::before { content: "− "; }
.how-body { padding: 0 14px 12px; font-size: 15px; display: flex; flex-direction: column; gap: 8px; }
.how-body ul { margin: 0; padding-left: 18px; }
.how-body a { color: var(--ball); font-weight: 600; }
.sets { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.set { display: grid; grid-template-columns: 34px 1fr 1fr 52px; gap: 8px; align-items: center; }
.set .lab { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); }
.set.done .lab { color: var(--good); }
.field { position: relative; }
.field input { width: 100%; background: var(--court); border: 1px solid var(--line); border-radius: 10px; padding: 11px 34px 11px 10px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.field input::placeholder { color: #5E7891; }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); pointer-events: none; }
.tick { width: 52px; height: 46px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--court); display: grid; place-items: center; font-size: 22px; font-weight: 700; color: transparent; }
.set.done .tick { background: var(--good); border-color: var(--good); color: #062A1B; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.cbox { height: 50px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--court); font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); }
.cbox.done { background: var(--good); border-color: var(--good); color: #062A1B; }
.warm { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); }
.warm summary { list-style: none; padding: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.warm summary::-webkit-details-marker { display: none; }
.warm-list { padding: 0 14px 12px; display: flex; flex-direction: column; }
.witem { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.witem .box { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 15px; color: transparent; font-weight: 700; }
.witem.done .box { background: var(--good); border-color: var(--good); color: #062A1B; }
.witem.done .wname { color: var(--muted); text-decoration: line-through; }
.wdose { font-size: 14px; color: var(--ball); font-weight: 600; white-space: nowrap; }
.wname { font-weight: 600; }
.wname small { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; text-decoration: none; }
.notice { border-radius: 12px; padding: 12px 14px; font-size: 14.5px; background: rgba(255,159,90,.12); border: 1px solid rgba(255,159,90,.4); }
.notice.info { background: var(--court-2); border-color: var(--line); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(14,34,54,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.timer { display: none; max-width: 560px; margin: 0 auto; padding: 10px 16px; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
.timer.on { display: flex; }
.timer .t { font-family: var(--display); font-size: 36px; font-weight: 700; min-width: 92px; font-variant-numeric: tabular-nums; }
.timer.over .t { color: var(--good); }
.timer .lbl { flex: 1; font-size: 13.5px; color: var(--muted); line-height: 1.2; }
.bar { height: 3px; background: var(--ball); transform-origin: left; }
.tabs { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs a { text-align: center; padding: 10px 4px 12px; text-decoration: none; color: var(--muted); font-size: 12.5px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs a svg { width: 22px; height: 22px; }
.tabs a.on { color: var(--ball); }
.log { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); }
.log summary { list-style: none; padding: 12px 14px; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; cursor: pointer; }
.log summary::-webkit-details-marker { display: none; }
.log .letter { width: 40px; height: 40px; font-size: 24px; border-radius: 10px; }
.log-body { padding: 0 14px 14px; font-size: 14.5px; display: flex; flex-direction: column; gap: 6px; }
.log-body .l { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
.log-body .l span:last-child { color: var(--muted); text-align: right; }
select { font: inherit; color: var(--chalk); background: var(--court-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
.chart { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.chart svg { width: 100%; height: auto; display: block; }
.ttable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ttable th, .ttable td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ttable th { font-family: var(--display); font-size: 15px; color: var(--muted); font-weight: 700; }
.ttable td input { width: 100%; min-width: 0; background: var(--court); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; font-size: 15px; text-align: center; font-variant-numeric: tabular-nums; }
.ttable td.n { font-weight: 600; }
.ttable td.n small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
label.fld { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.sw { width: 52px; height: 30px; border-radius: 999px; background: var(--court-3); border: 0; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--chalk); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--ball); }
.sw[aria-checked="true"]::after { transform: translateX(22px); background: var(--ball-ink); }
.modal { position: fixed; inset: 0; background: rgba(5,12,20,.7); display: none; align-items: flex-end; justify-content: center; z-index: 30; padding: 16px; }
.modal.on { display: flex; }
.sheet { background: var(--court-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; margin-bottom: env(safe-area-inset-bottom); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); background: var(--good); color: #062A1B; font-weight: 700; padding: 10px 16px; border-radius: 999px; z-index: 40; display: none; }
.toast.on { display: block; }
.sync { font-size: 12.5px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app"><p class="muted">Chargement de ton programme…</p></main>

<div class="dock">
  <div class="timer" id="timer" role="timer" aria-live="polite">
    <div class="t" id="tval">0:00</div>
    <div class="lbl" id="tlbl">Repos</div>
    <button class="btn sm ghost" id="tplus" type="button">+15 s</button>
    <button class="btn sm" id="tskip" type="button">Passer</button>
  </div>
  <div class="bar" id="tbar" style="transform: scaleX(0)"></div>
  <nav class="tabs" id="tabs">
    <a href="#accueil" data-tab="accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M12 4v16"/></svg>Semaine</a>
    <a href="#historique" data-tab="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>Historique</a>
    <a href="#competition" data-tab="competition"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>Compét</a>
    <a href="#tests" data-tab="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="7"/><path d="M12 13V9M10 3h4"/></svg>Tests</a>
    <a href="#reglages" data-tab="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</a>
  </nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const same = v => [v, v, v];

const WARMUP = [
  ["Cardio léger", "3 min", "Rameur ou vélo, facile : tu peux parler."],
  ["Hanches en 90/90", "5 / côté", "Assis, jambes pliées à 90°, bascule les genoux d'un côté à l'autre sans les mains."],
  ["World's greatest stretch", "5 / côté", "Grande fente, coude vers la cheville, puis ouvre le bras vers le plafond."],
  ["Rotations du haut du dos", "8 / côté", "À quatre pattes, main derrière la tête, ferme puis ouvre le coude vers le plafond."],
  ["Genou au mur", "10 / côté", "Pied à 10 cm du mur, le genou touche le mur sans décoller le talon."],
  ["Oiseau haltères légers", "15", "Penché dos plat, 2-4 kg, écarte les bras en serrant les omoplates."],
  ["Rotations externes poulie", "15 / bras", "Poulie à hauteur de coude, charge mini, coude collé, avant-bras vers l'extérieur."],
  ["Pont fessier", "12", "Sur le dos, monte le bassin, serre 1 s en haut."],
  ["Fentes latérales poids du corps", "8 / côté", "Grand pas de côté, fesses en arrière, l'autre jambe tendue."],
  ["Sauts rebonds + montées de genoux", "2×10 · 2×10 m", "Petits sauts rapides sur les pointes, puis genoux hauts sur 10 m."]
];

const PROGRAM = {
  A: {
    title: "Séance A", sub: "Bas du corps + explosivité", day: "Lundi", dur: "60-70 min",
    warning: "Jamais la veille d'un match : garde 48 h entre la séance A et un match.",
    groups: [{ items: [
      { id: "boxjump", name: "Box jump", sets: same(4), reps: same("3"), rest: 90, kind: "check",
        why: "Détente, première impulsion",
        how: "Bras en arrière, petite flexion, saute à deux pieds sur la box en lançant les bras. Réception jambes fléchies, sans bruit. Redescends en marchant.",
        cues: ["Qualité avant hauteur : chaque saut explosif.", "Si le saut ralentit, arrête la série.", "Pas de box ? Step ou banc stable, ou sauts verticaux sur place."],
        bloc: ["Box moyenne, focus sur la réception.", "Box plus haute.", "Box haute, et des squats sautés légers (20-30 % de ta charge de squat) juste après tes séries de squat."],
        video: yt("box jump technique") },
      { id: "squat", name: "Squat barre", sets: [4, 4, 3], reps: ["8", "5", "3"], rest: 150, kind: "load", inc: 2.5,
        why: "Force, puissance de jambes",
        how: "Barre sur le haut du dos (ou trap bar). Pieds largeur d'épaules. Descente contrôlée en 2 s jusqu'à cuisses parallèles, remontée la plus rapide possible.",
        cues: ["Dos gainé, poitrine haute, talons au sol.", "Genoux dans l'axe des pieds.", "1 à 2 répétitions en réserve."],
        bloc: ["Charge modérée.", "Charge lourde.", "Charge lourde, puis 3 squats sautés légers juste après chaque série."],
        video: yt("squat barre technique") },
      { id: "bulgare", name: "Fente bulgare haltères", unit: "/ jambe", sets: same(3), reps: ["10-12", "8-10", "8-10"], rest: 90, kind: "load", inc: 2,
        why: "Jambes, fessiers, équilibre",
        how: "Pied arrière sur un banc, un haltère dans chaque main. Descends jusqu'à cuisse avant parallèle, pousse dans le talon avant. Toute une jambe, puis l'autre.",
        cues: ["Buste légèrement penché pour charger les fessiers.", "Le genou avant ne rentre pas.", "Charge = poids d'un haltère."],
        video: yt("fente bulgare haltères") },
      { id: "rdl", name: "Soulevé de terre roumain", sets: same(3), reps: ["10-12", "8-10", "8-10"], rest: 120, kind: "load", inc: 2.5,
        why: "Ischios, chaîne arrière",
        how: "Jambes presque tendues, pousse les fesses en arrière en faisant glisser la barre le long des cuisses, dos plat, jusqu'à l'étirement derrière les cuisses. Remonte en poussant les hanches.",
        cues: ["Dos plat, jamais arrondi.", "La barre reste collée aux jambes."],
        video: yt("soulevé de terre roumain") },
      { id: "fentelat", name: "Fente latérale goblet", unit: "/ côté", sets: same(3), reps: same("6"), rest: 60, kind: "load", inc: 2,
        why: "Ton déplacement de défense",
        how: "Haltère contre la poitrine. Grand pas de côté, descends sur cette jambe, l'autre reste tendue. Pousse fort pour revenir au centre.",
        cues: ["Pied d'appui à plat, genou dans l'axe.", "Poussée explosive pour revenir."],
        video: yt("fente latérale goblet") },
      { id: "mollets", name: "Mollets + relèvement des orteils", sets: same(3), reps: same("12+15"), rest: 45, kind: "check",
        why: "Tendons, chevilles",
        how: "Enchaîne : 12 montées sur la pointe des pieds sur une marche (1 s en haut, descente lente), puis 15 relèvements des orteils dos au mur, talons à 30 cm.",
        cues: ["Amplitude complète, pas de rebond."],
        video: yt("tibialis raise") },
      { id: "pallof", name: "Pallof press", unit: "/ côté", sets: same(3), reps: same("10"), rest: 45, kind: "load", inc: 1,
        why: "Gainage anti-rotation",
        how: "De profil à une poulie à hauteur de poitrine. Poignée contre la poitrine, pousse bras tendus, tiens 2 s, ramène. Le buste ne tourne pas.",
        cues: ["Bassin fixe, abdos serrés.", "Plus c'est lent, plus c'est efficace."],
        video: yt("pallof press") }
    ] }]
  },
  B: {
    title: "Séance B", sub: "Haut du corps + rotation", day: "Mercredi", dur: "60 min",
    warning: "Peut se faire la veille d'un match.",
    groups: [{ items: [
      { id: "rotpoulie", name: "Rotation explosive à la poulie", unit: "/ côté", sets: same(4), reps: same("5"), rest: 60, kind: "load", inc: 1,
        why: "Puissance de rotation",
        how: "Poulie à hauteur de poitrine, charge légère à moyenne. De profil, tourne d'abord les hanches, puis les épaules, et tire la poignée d'un coup sec de l'autre côté, comme un coup droit. Retour lent.",
        cues: ["La force part des hanches.", "Aller explosif, retour en 2 s."],
        video: yt("cable rotation explosive") },
      { id: "incline", name: "Développé incliné haltères", sets: same(4), reps: ["10-12", "8-10", "8-10"], rest: 120, kind: "load", inc: 2,
        why: "Haut des pectoraux",

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = n => n == null ? "" : String(Math.round(n * 100) / 100).replace(".", ",");
const DAY = 86400000;
function mondayOf(d) { const x = new Date(d); x.setHours(12, 0, 0, 0); const wd = (x.getDay() + 6) % 7; x.setTime(x.getTime() - wd * DAY); return x; }
function isoDate(d) { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); }
function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); }
const frDate = d => new Date(d).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const restLabel = s => s >= 60 ? (s % 60 ? Math.floor(s / 60) + " min " + (s % 60) : (s / 60) + " min") : s + " s";
function repRange(r) { const m = String(r).match(/^(\d+)(?:-(\d+))?$/); return m ? { lo: +m[1], hi: +(m[2] || m[1]) } : null; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200); }

const Store = {
  mode: "local", base: null, logsCol: null,
  async init() {
    try {
      const db = await claude.use("db"); const user = await claude.use("user");
      const uid = user ? await user.id() : null;
      if (db && uid) {
        this.base = db.collection("data/users/" + uid);
        this.logsCol = db.doc("data/users/" + uid + "/journal").collection("logs");
        this.mode = "db";
      }
    } catch (e) { this.mode = "local"; }
  },
  lsGet(k) { try { return JSON.parse(localStorage.getItem("padelapp2:" + k)); } catch (e) { return null; } },
  lsSet(k, v) { try { v == null ? localStorage.removeItem("padelapp2:" + k) : localStorage.setItem("padelapp2:" + k, JSON.stringify(v)); } catch (e) {} },
  withTimeout(p) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 10000))]); },
  async get(k) {
    if (this.mode === "db") { const s = await this.withTimeout(this.base.doc(k).get()); return s.exists ? s.data() : null; }
    return this.lsGet(k);
  },
  queues: {},
  set(k, v) {
    if (this.mode !== "db") { this.lsSet(k, v); return Promise.resolve(); }
    const prev = this.queues[k] || Promise.resolve();
    const run = prev.catch(() => {}).then(() => v == null ? this.base.doc(k).delete() : this.base.doc(k).set(JSON.parse(JSON.stringify(v))));
    this.queues[k] = run; return run;
  },
  async logs() {
    if (this.mode === "db") { const q = await this.withTimeout(this.logsCol.orderBy("date", "desc").limit(400).get()); return q.docs.map(d => ({ ...d.data(), _id: d.id })); }
    return (this.lsGet("logs") || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  },
  async addLog(log) {
    const id = "log-" + Date.now();
    if (this.mode === "db") { await this.logsCol.doc(id).set(log); }
    else { const l = this.lsGet("logs") || []; l.push({ ...log, _id: id }); this.lsSet("logs", l); }
    return id;
  },
  async delLog(id) {
    if (this.mode === "db") await this.logsCol.doc(id).delete();
    else this.lsSet("logs", (this.lsGet("logs") || []).filter(l => l._id !== id));
  }
};

const S = { settings: null, current: null, logs: [], tests: {}, loadError: null };

function weekInfo(date = new Date()) {
  if (!S.settings?.startDate) return null;
  const start = parseISO(S.settings.startDate);
  const w = Math.floor((mondayOf(date) - mondayOf(start)) / (7 * DAY)) + 1;
  const week = Math.max(1, w);
  const cw = Math.min(week, 12);
  const bloc = Math.min(2, Math.floor((cw - 1) / 4));
  return { week, cw, bloc, deload: cw % 4 === 0, over: week > 12, notStarted: w < 1, tournament: (S.settings.tournamentWeeks || []).includes(week) || compTournamentWeek(date) };
}
function presc(ex, wi) {
  let sets = ex.sets[wi.bloc];
  if (ex.kind !== "interval") {
    if (wi.deload) sets = Math.max(2, Math.round(sets * 0.6));
    if (wi.tournament) sets = Math.max(1, Math.ceil(sets / 2));
  } else if (wi.deload || wi.tournament) sets = Math.max(4, Math.round(sets * (wi.tournament ? 0.5 : 0.6)));
  return { sets, reps: ex.reps[wi.bloc] };
}
function lastFor(exId) {
  for (const l of S.logs) { const e = l.entries?.[exId]; if (e && e.some(s => s.done)) return { log: l, sets: e }; }
  return null;
}
function doneThisWeek(wi) {
  const set = new Set();
  for (const l of S.logs) if (l.week === wi.week && l.cycleStart === S.settings.startDate) set.add(l.session);
  return set;
}
function allItems(key) { return PROGRAM[key].groups.flatMap(g => g.items); }

  if (h === "tests") { setTab(h); return renderTests(); }

}

function exCard(ex, n, wi, cur) {
  const pr = presc(ex, wi);
  const entries = cur?.entries?.[ex.id] || [];
  const last = lastFor(ex.id);
  const complete = entries.filter(s => s?.done).length >= pr.sets;
  let lastTxt = "", hint = "", sugKg = null;
  if (last && (ex.kind === "load" || ex.kind === "bw")) {
    const ds = last.sets.filter(s => s.done);
    const kgs = ds.map(s => s.kg).filter(v => v != null);
    const top = kgs.length ? Math.max(...kgs) : null;
    const reps = ds.map(s => s.reps ?? "–").join("/");
    lastTxt = `Dernière fois (${frDate(last.log.date)}) : <b>${top != null ? fmt(top) + " kg" : ex.kind === "bw" ? "poids du corps" : "–"}</b>${ex.noReps ? "" : " · " + reps + " rép."}`;
    const rr = repRange(pr.reps);
    if (rr && !ex.noReps && ds.length >= last.sets.length && ds.length && ds.every(s => (s.reps ?? 0) >= rr.hi)) {
      if (!(ex.kind === "bw" && top == null)) sugKg = (top || 0) + ex.inc;
      hint = ex.kind === "bw" && top == null ? `Tu as tout fait à ${rr.hi} rép. : ajoute du lest ou vise plus.` : `Tout validé à ${rr.hi} rép. : monte à ${fmt((top || 0) + ex.inc)} kg.`;
    }
  }
  let setsHtml;
  if (ex.kind === "check" || ex.kind === "interval") {

      const phKg = sugKg != null ? fmt(sugKg) : ls.kg != null ? fmt(ls.kg) : (ex.kind === "bw" ? "0" : "");
      const phReps = sugKg != null && rr ? rr.lo : ls.reps != null ? ls.reps : rr ? rr.lo : "";

        <button class="tick" data-ex="${ex.id}" data-i="${i}" type="button" aria-label="Valider la série ${i + 1}" aria-pressed="${!!e.done}">✓</button>
      </div>`;

  return `<article class="ex ${complete ? "complete" : ""}" id="ex-${ex.id}">
    <div class="ex-head"><span class="ex-num">${n}</span><div><h3>${esc(ex.name)}</h3>${ex.why ? `<div class="small muted">${esc(ex.why)}</div>` : ""}</div>
      <div class="presc">${pr.sets} × ${esc(pr.reps)}<small>${ex.unit ? esc(ex.unit) + " · " : ""}${ex.rest ? "repos " + restLabel(ex.rest) : ""}</small></div></div>
    ${lastTxt || hint || ex.bloc ? `<div class="ex-meta">${lastTxt ? `<div class="last">${lastTxt}</div>` : ""}${hint ? `<div class="hint">${hint}</div>` : ""}${ex.bloc && !lastTxt ? `<div class="last">${esc(ex.bloc[wi.bloc])}</div>` : ""}</div>` : ""}
    <details class="how"><summary>Comment faire</summary><div class="how-body"><p style="margin:0">${esc(ex.how)}</p>${ex.cues?.length ? `<ul>${ex.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}${blocNote}${ex.video ? `<a href="${ex.video}" target="_blank" rel="noopener">Voir une vidéo de démo ›</a>` : ""}</div></details>
    <div class="sets">${setsHtml}</div>

}

function findEx(key, id) { return allItems(key).find(e => e.id === id); }

function bindSession(key) {
  const wi = weekInfo();
  app.querySelectorAll(".witem").forEach(b => b.onclick = () => {
    const c = ensureCurrent(key); const i = +b.dataset.w; c.warm[i] = !c.warm[i];
    b.classList.toggle("done", !!c.warm[i]);
    const d = WARMUP.filter((_, j) => c.warm[j]).length; const wc = $("#wcount"); wc.textContent = d + "/" + WARMUP.length; wc.classList.toggle("good", d === WARMUP.length);
    saveCurrent();
  });
  app.querySelectorAll("input[data-ex]").forEach(inp => inp.oninput = () => {
    const c = ensureCurrent(key); const { ex, i, f } = inp.dataset;
    c.entries[ex] = c.entries[ex] || []; c.entries[ex][i] = c.entries[ex][i] || {};
    c.entries[ex][i][f] = f === "reps" ? (num(inp.value) == null ? null : Math.round(num(inp.value))) : num(inp.value);
    saveCurrent();
  });
  app.querySelectorAll(".tick").forEach(b => b.onclick = () => {
    unlockAudio();
    const c = ensureCurrent(key); const { ex, i } = b.dataset; const exo = findEx(key, ex);
    c.entries[ex] = c.entries[ex] || []; const e = c.entries[ex][i] = c.entries[ex][i] || {};
    e.done = !e.done;
    if (e.done) {
      const kgIn = $("#kg-" + ex + "-" + i), rpIn = $("#rp-" + ex + "-" + i);
      if (e.kg == null && kgIn && kgIn.placeholder !== "") { e.kg = num(kgIn.placeholder); kgIn.value = kgIn.placeholder; }
      if (rpIn && e.reps == null && rpIn.placeholder !== "") { e.reps = Math.round(num(rpIn.placeholder)); rpIn.value = rpIn.placeholder; }
      if (exo.kind === "bw" && e.kg == null) e.kg = 0;
    }
    b.closest(".set").classList.toggle("done", e.done); b.setAttribute("aria-pressed", e.done);
    afterTick(key, exo, wi, e.done); saveCurrent();
  });
  app.querySelectorAll(".cbox").forEach(b => b.onclick = () => {
    unlockAudio();
    const c = ensureCurrent(key); const { ex, i } = b.dataset; const exo = findEx(key, ex);
    c.entries[ex] = c.entries[ex] || []; const e = c.entries[ex][i] = c.entries[ex][i] || {};
    e.done = !e.done; b.classList.toggle("done", e.done); b.setAttribute("aria-pressed", e.done);
    if (exo.kind !== "interval") afterTick(key, exo, wi, e.done); else markComplete(exo, wi);
    saveCurrent();
  });
  app.querySelectorAll("[data-interval]").forEach(b => b.onclick = () => { unlockAudio(); ensureCurrent(key); startIntervals(key, findEx(key, b.dataset.interval), wi); });
  $("#finish").onclick = () => finishSession(key);
  const ab = $("#abandon"); if (ab) ab.onclick = () => confirmSheet("Abandonner la séance ?", "Ce que tu as noté sera perdu.", "Abandonner", async () => { S.current = null; stopTimer(); await Store.set("current", null).catch(() => {}); location.hash = "#accueil"; });
}

function markComplete(ex, wi) {
  const pr = presc(ex, wi); const n = (S.current.entries[ex.id] || []).filter(s => s?.done).length;
  const card = $("#ex-" + ex.id); if (card) card.classList.toggle("complete", n >= pr.sets);
  return n >= pr.sets;
}
function afterTick(key, ex, wi, done) {
  const complete = markComplete(ex, wi);
  if (!done || !ex.rest) return;
  const items = allItems(key); const idx = items.indexOf(ex);
  const nextEx = complete ? items[idx + 1] : null;
  startTimer(ex.rest, complete ? (nextEx ? "Ensuite : " + nextEx.name : "Dernier exercice terminé") : "Repos · " + ex.name);
}

let audio = null;
function unlockAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { audio = null; } }
function beep(at = 0, f = 880, d = .18) {
  if (!audio) return;
  try { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    const t = audio.currentTime + at; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.start(t); o.stop(t + d + .05); } catch (e) {}
}
const T = { end: 0, total: 0, h: null, label: "", phases: null, pi: 0, onPhase: null };
function startTimer(sec, label) {
  T.phases = null; T.total = sec; T.end = Date.now() + sec * 1000; T.label = label; T.beeped = false;
  $("#tlbl").textContent = label; $("#timer").classList.add("on"); $("#tplus").style.display = "";
  tick(); clearInterval(T.h); T.h = setInterval(tick, 250);
}
function tick() {
  const left = (T.end - Date.now()) / 1000;
  if (T.phases) {
    if (left <= 0) { T.pi++; if (T.pi >= T.phases.length) { beep(0, 660, .5); stopTimer(); toast("Intervalles terminés"); return; } runPhase(); return; }
    if (left <= 3.05 && !T.cd?.[Math.ceil(left)]) { T.cd = T.cd || {}; T.cd[Math.ceil(left)] = 1; beep(0, 520, .08); }
  } else if (left <= 0 && !T.beeped) { T.beeped = true; beep(0); beep(.25); beep(.5, 1100, .3); $("#timer").classList.add("over"); $("#tlbl").textContent = "C'est reparti !"; }
  $("#tval").textContent = (left < 0 && !T.phases ? "+" : "") + mmss(Math.abs(left));
  $("#tbar").style.transform = `scaleX(${Math.max(0, Math.min(1, left / T.total))})`;
  if (!T.phases && left < -60) stopTimer();
}
function stopTimer() { clearInterval(T.h); T.phases = null; $("#timer").classList.remove("on", "over"); $("#tbar").style.transform = "scaleX(0)"; }
$("#tplus").onclick = () => { T.end += 15000; T.total += 15; $("#timer").classList.remove("over"); T.beeped = false; $("#tlbl").textContent = T.label; tick(); };
$("#tskip").onclick = () => stopTimer();

function startIntervals(key, ex, wi) {
  const pr = presc(ex, wi);
  const [on, off] = pr.reps.match(/\d+/g).map(Number);
  const phases = [{ s: 10, l: "Prépare-toi" }];
  for (let i = 0; i < pr.sets; i++) { phases.push({ s: on, l: `Effort ${i + 1}/${pr.sets} · à fond`, work: i }); if (i < pr.sets - 1) phases.push({ s: off, l: `Récup · encore ${pr.sets - i - 1}` }); }
  T.phases = phases; T.pi = 0; T.key = key; T.ex = ex; T.wi = wi;
  $("#timer").classList.add("on"); $("#timer").classList.remove("over"); $("#tplus").style.display = "none";
  runPhase(); clearInterval(T.h); T.h = setInterval(tick, 200);
}
function runPhase() {
  const ph = T.phases[T.pi]; T.total = ph.s; T.end = Date.now() + ph.s * 1000; T.cd = {};
  $("#tlbl").textContent = ph.l; beep(0, ph.work != null ? 1100 : 700, .25);
  if (T.pi > 0) { const prev = T.phases[T.pi - 1]; if (prev.work != null && S.current) {
    const c = S.current; c.entries[T.ex.id] = c.entries[T.ex.id] || []; c.entries[T.ex.id][prev.work] = { done: true };
    const b = app.querySelector(`.cbox[data-ex="${T.ex.id}"][data-i="${prev.work}"]`); if (b) { b.classList.add("done"); b.setAttribute("aria-pressed", "true"); }
    markComplete(T.ex, T.wi); saveCurrent(); } }
  tick();
}

function finishSession(key) {
  const c = S.current;
  const any = c && Object.values(c.entries).some(a => a.some(s => s?.done));
  if (!any) { toast("Valide au moins une série avant de terminer"); return; }
  const wi = weekInfo();
  const items = allItems(key);
  const missing = items.filter(ex => (c.entries[ex.id] || []).filter(s => s?.done).length < presc(ex, wi).sets).length;
  confirmSheet("Terminer la séance " + key + " ?", missing ? `${missing} exercice${missing > 1 ? "s" : ""} pas complètement validé${missing > 1 ? "s" : ""}. Elle sera quand même enregistrée.` : "Tout est validé. Bien joué.", "Enregistrer", async () => {
    const clean = {};
    for (const [k, arr] of Object.entries(c.entries)) clean[k] = (arr || []).map(s => ({ kg: s?.kg ?? null, reps: s?.reps ?? null, done: !!s?.done }));
    const log = { session: key, date: new Date().toISOString(), week: wi.week, bloc: wi.bloc + 1, deload: wi.deload, tournament: wi.tournament,
      cycleStart: S.settings.startDate, durationMin: Math.max(1, Math.round((Date.now() - c.startedAt) / 60000)), entries: clean };
    try {
      const id = await Store.addLog(log);
      S.logs.unshift({ ...log, _id: id }); S.current = null; stopTimer();
      await Store.set("current", null).catch(() => {});
      toast("Séance " + key + " enregistrée"); location.hash = "#accueil";
    } catch (e) { toast("Enregistrement impossible, réessaie"); }
  });
}

function confirmSheet(title, text, okLabel, onOk) {
  $("#sheet").innerHTML = `<h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(text)}</p><button class="btn primary block" id="m-ok" type="button">${esc(okLabel)}</button><button class="btn ghost block" id="m-no" type="button">Annuler</button>`;

  const close = () => $("#modal").classList.remove("on");
  $("#m-no").onclick = close; $("#modal").onclick = e => { if (e.target.id === "modal") close(); };
  $("#m-ok").onclick = async () => { close(); await onOk(); };
}

function renderHistory() {

  }));

function drawChart() {
  const pts = S.logs.slice().reverse().map(l => {
    const e = (l.entries?.[chartEx] || []).filter(s => s.done && s.kg != null);
    return e.length ? { d: new Date(l.date), v: Math.max(...e.map(s => s.kg)) } : null;
  }).filter(Boolean);
  const el = $("#chart");
  if (pts.length < 2) { el.innerHTML = `<p class="muted small" style="margin:6px">${pts.length ? "Une seule séance notée (" + fmt(pts[0].v) + " kg). La courbe apparaît dès la deuxième." : "Pas encore de charge notée sur cet exercice."}</p>`; return; }
  const W = 340, H = 170, pl = 36, pr = 14, pt = 14, pb = 26;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs); if (hi === lo) { hi += 5; lo = Math.max(0, lo - 5); }
  const pad = (hi - lo) * .15; lo = Math.max(0, lo - pad); hi += pad;
  const x = i => pl + (W - pl - pr) * (i / (pts.length - 1)); const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo, (lo + hi) / 2, hi].map(v => Math.round(v));
  const line = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const area = line + ` L${x(pts.length - 1).toFixed(1)} ${H - pb} L${pl} ${H - pb} Z`;
  const L = pts[pts.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la charge">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="#2C5277" stroke-width="1"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#9DB2C6">${t}</text>`).join("")}
    <path d="${area}" fill="rgba(244,209,61,.12)"/><path d="${line}" fill="none" stroke="#F4D13D" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 5 : 2.5}" fill="#F4D13D"/>`).join("")}
    <text x="${pl}" y="${H - 8}" font-size="11" fill="#9DB2C6">${pts[0].d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</text>
    <text x="${W - pr}" y="${H - 8}" font-size="11" fill="#9DB2C6" text-anchor="end">${L.d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} · ${fmt(L.v)} kg</text>
  </svg>`;
}

function firstTuesday(y, m) { const d = new Date(y, m, 1, 12); while (d.getDay() !== 2) d.setDate(d.getDate() + 1); return d; }

}

function countedPoints(results, pub) {
  const from = new Date(pub); from.setFullYear(from.getFullYear() - 1);
  const ok = results.filter(r => { const d = parseISO(r.date); return d > from && d < pub; }).sort((a, b) => b.pts - a.pts);
  const best = ok.slice(0, 12);
  return { total: best.reduce((s, r) => s + (r.pts || 0), 0), used: best, dropped: ok.slice(12) };
}
function rankFromCuts(pts, rows) {
  if (pts <= 0) return null;
  const r = rows.slice().sort((a, b) => a[0] - b[0]); // rang croissant, points décroissants
  if (pts >= r[0][1]) return r[0][0];
  for (let i = 1; i < r.length; i++) {
    const [r1, p1] = r[i - 1], [r2, p2] = r[i];
    if (pts >= p2) { // interpolation log sur les points
      const t = (Math.log(p1) - Math.log(pts)) / (Math.log(p1) - Math.log(p2));
      return Math.round(r1 + t * (r2 - r1));
    }
  }
  return r[r.length - 1][0];
}
function estimateRank(pts) {
  const c = S.comp; const last = c.history[c.history.length - 1];
  const raw = rankFromCuts(pts, c.cuts.rows); if (raw == null) return null;
  // calage sur ton dernier classement réel
  const base = last ? rankFromCuts(last.points, c.cuts.rows) : null;
  const k = base && last.rank ? last.rank / base : 1;
  const v = raw * k; return v > 1000 ? Math.round(v / 100) * 100 : Math.round(v);
}

  const h = S.comp.history; const el = $("#c-chart"); if (!el) return;
  const W = 340, H = 150, pl = 50, pr = 12, pt = 12, pb = 24;
  const vs = h.map(x => x.rank); let lo = Math.min(...vs), hi = Math.max(...vs); if (lo === hi) { lo *= .9; hi *= 1.1; }
  const x = i => pl + (W - pl - pr) * (i / (h.length - 1)); const y = v => pt + (H - pt - pb) * ((v - lo) / (hi - lo)); // meilleur rang en haut
  const line = h.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.rank).toFixed(1)).join(" ");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du classement">
    ${[lo, hi].map(t => `<text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#9DB2C6">${frNum(t)}</text><line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="#2C5277"/>`).join("")}
    <path d="${line}" fill="none" stroke="#F4D13D" stroke-width="2.5"/>
    ${h.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.rank)}" r="3" fill="#F4D13D"/><text x="${x(i)}" y="${H - 6}" font-size="10" fill="#9DB2C6" text-anchor="middle">${monthLabel(p.month)}</text>`).join("")}
  </svg>`;
}

const inp = (id, ph, v = "", mode = "text") => `<input id="${id}" inputmode="${mode}" placeholder="${ph}" value="${esc(v)}" style="width:100%;background:var(--court);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px">`;
function openSheet(html, onSave) {
  $("#sheet").innerHTML = html + `<button class="btn primary block" id="m-ok" type="button">Enregistrer</button><button class="btn ghost block" id="m-no" type="button">Annuler</button>`;
  $("#modal").classList.add("on");
  const close = () => $("#modal").classList.remove("on");
  $("#m-no").onclick = close; $("#modal").onclick = e => { if (e.target.id === "modal") close(); };
  $("#m-ok").onclick = async () => { if ((await onSave()) !== false) { close(); renderComp(); } };
}
function rankSheet() {
  const now = new Date(); const ym = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  openSheet(`<h2>Nouveau classement</h2><p class="small muted" style="margin:0">Recopie ce que t'affiche Ten'Up après la sortie du mardi.</p>
    <label class="fld">Mois<input id="k-m" type="month" value="${ym}" style="background:var(--court);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;color:var(--chalk)"></label>
    <label class="fld">Rang${inp("k-r", "ex. 74000", "", "numeric")}</label><label class="fld">Points${inp("k-p", "ex. 34", "", "numeric")}</label>`, async () => {
    const m = $("#k-m").value, r = num($("#k-r").value), p = num($("#k-p").value);
    if (!m || !r || p == null) { toast("Remplis les 3 champs"); return false; }
    const c = S.comp; c.history = c.history.filter(x => x.month !== m); c.history.push({ month: m, rank: r, points: p }); c.history.sort((a, b) => a.month.localeCompare(b.month));
    const [yy, mm] = m.split("-").map(Number); const pubM = firstTuesday(yy, mm - 1);
    c.results.forEach(x => { if (x.estimated && parseISO(x.date) < pubM) delete x.estimated; });
    await saveComp(); toast("Classement enregistré");
  });
}
function tourSheet(t = {}) {
  openSheet(`<h2>${t.id ? "Modifier le tournoi" : "Nouveau tournoi"}</h2>
    <label class="fld">Date<input id="t-d" type="date" value="${t.date || isoDate(new Date())}" style="background:var(--court);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;color:var(--chalk)"></label>
    <label class="fld">Catégorie<select id="t-c">${CATS.map(k => `<option ${k === (t.cat || "P25") ? "selected" : ""}>${k}</option>`).join("")}</select></label>
    <label class="fld">Nom / club${inp("t-n", "ex. P25 Corbas", t.name || "")}</label>
    <label class="fld">Partenaire${inp("t-p", "ex. Lucas Gutierrez", t.partner || "").replace("<input", '<input list="plist"')}</label>${partnerList()}`, async () => {
    const c = S.comp; const d = $("#t-d").value; if (!d) { toast("Choisis une date"); return false; }
    const item = { id: t.id || "u" + Date.now(), date: d, cat: $("#t-c").value, name: $("#t-n").value.trim(), partner: $("#t-p").value.trim() };
    c.upcoming = (c.upcoming || []).filter(x => x.id !== item.id); c.upcoming.push(item); await saveComp(); toast("Tournoi ajouté");
  });
}
function resultSheet(r = {}) {
  openSheet(`<h2>${r.id && !r.fromUpcoming ? "Modifier le résultat" : "Résultat du tournoi"}</h2>
    <label class="fld">Date<input id="r-d" type="date" value="${r.date || isoDate(new Date())}" style="background:var(--court);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;color:var(--chalk)"></label>
    <div class="row"><label class="fld" style="flex:1">Catégorie<select id="r-c">${CATS.map(k => `<option ${k === (r.cat || "P25") ? "selected" : ""}>${k}</option>`).join("")}</select></label>
    <label class="fld" style="width:90px">Paires${inp("r-n", "16", r.pairs || "", "numeric")}</label><label class="fld" style="width:90px">Place${inp("r-pl", "8", r.place || "", "numeric")}</label></div>
    <label class="fld">Points <span class="small muted" id="r-hint"></span>${inp("r-pts", "calculés tout seuls", r.pts ?? "", "numeric")}</label>
    <label class="fld">Nom / club${inp("r-nm", "ex. P25 Corbas", r.name || "")}</label>
    <label class="fld">Partenaire${inp("r-pa", "", r.partner || "").replace("<input", '<input list="plist"')}</label>${partnerList()}
    <label class="fld">Matchs (V/D)${inp("r-m", "ex. D V D D", r.matches || "")}</label>`, async () => {
    const c = S.comp; const pts = num($("#r-pts").value) ?? baremePts($("#r-c").value, +$("#r-pl").value, +$("#r-n").value);
    if (!$("#r-d").value || pts == null) { toast("Il manque la date ou les points"); return false; }
    const item = { id: r.fromUpcoming || !r.id ? "r" + Date.now() : r.id, date: $("#r-d").value, cat: $("#r-c").value, pairs: +$("#r-n").value || null, place: +$("#r-pl").value || null, pts,
      name: $("#r-nm").value.trim() || $("#r-c").value, partner: $("#r-pa").value.trim(), matches: $("#r-m").value.trim().toUpperCase(), estimated: true };
    c.results = c.results.filter(x => x.id !== item.id); c.results.push(item);
    if (r.fromUpcoming) c.upcoming = c.upcoming.filter(x => x.id !== r.id);
    await saveComp(); toast("Résultat enregistré");
  });
  const hint = () => { const p = baremePts($("#r-c").value, +$("#r-pl").value, +$("#r-n").value); $("#r-hint").textContent = p != null ? "· barème : " + p : ""; if (p != null && !$("#r-pts").dataset.touched) $("#r-pts").value = p; };
  ["#r-c", "#r-n", "#r-pl"].forEach(s => $(s).oninput = hint); $("#r-pts").oninput = () => { $("#r-pts").dataset.touched = 1; };
}

function renderSettings() {
  const wi = weekInfo();
  const opts = Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${wi && wi.cw === i + 1 ? "selected" : ""}>Semaine ${i + 1}${(i + 1) % 4 === 0 ? " (allégée)" : ""}</option>`).join("");
  app.innerHTML = `
  <div class="stack">
    <h1>Réglages</h1>
    <label class="fld" for="set-week">Cette semaine, je suis en
      <select id="set-week">${opts}</select></label>
    <p class="small muted" style="margin:-4px 0 0">Change-la si tu as pris du retard (blessure, vacances) : la suite du programme se recale.</p>
    <button class="btn primary block" id="set-save" type="button">Enregistrer</button>
    <h2 style="margin-top:12px">Nouveau cycle</h2>
    <p class="small muted" style="margin:0">Repars en semaine 1 aujourd'hui. Ton historique est conservé.</p>
    <button class="btn ghost block" id="set-restart" type="button">Recommencer les 12 semaines</button>
    <h2 style="margin-top:12px">Rappels</h2>
    <div class="notice info small">Charge : garde 1 à 2 répétitions en réserve. Chaque semaine, +1 répétition ou un peu de charge si la technique reste propre. Douleur au coude, à l'épaule ou au genou plus de 10 jours : on allège et on consulte.</div>
    <h2 style="margin-top:12px">Sauvegarde</h2>
    <p class="small muted" style="margin:0">Tes données sont sur ce téléphone. Copie la sauvegarde de temps en temps (dans Notes par exemple) pour pouvoir la restaurer.</p>
    <button class="btn ghost block" id="bk-copy" type="button">Copier ma sauvegarde</button>
    <textarea id="bk-in" rows="3" placeholder="Colle ici une sauvegarde pour la restaurer" style="width:100%;background:var(--court-2);color:var(--chalk);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px"></textarea>
    <button class="btn ghost block" id="bk-restore" type="button">Restaurer</button>
    <p class="sync">Données sur cet appareil uniquement.</p>
  </div>`;
  $("#bk-copy").onclick = async () => {
    const data = JSON.stringify({ v: 1, settings: S.settings, tests: S.tests, logs: Store.lsGet("logs") || [], current: S.current, comp: S.comp });
    try { await navigator.clipboard.writeText(data); toast("Sauvegarde copiée"); }
    catch (e) { $("#bk-in").value = data; $("#bk-in").select(); toast("Copie-la depuis le champ"); }
  };
  $("#bk-restore").onclick = () => {
    let d; try { d = JSON.parse($("#bk-in").value); } catch (e) { toast("Sauvegarde illisible"); return; }
    if (!d || !d.settings) { toast("Sauvegarde illisible"); return; }
    confirmSheet("Restaurer cette sauvegarde ?", "Elle remplace les données actuelles de l'appli.", "Restaurer", async () => {
      Store.lsSet("settings", d.settings); Store.lsSet("tests", d.tests || {}); Store.lsSet("logs", d.logs || []); Store.lsSet("current", d.current || null); if (d.comp) Store.lsSet("comp", d.comp);
      location.reload();
    });
  };
  $("#set-save").onclick = async () => {
    const n = +$("#set-week").value;
    S.settings = { ...(S.settings || {}), startDate: isoDate(new Date(mondayOf(new Date()).getTime() - (n - 1) * 7 * DAY)), tournamentWeeks: S.settings?.tournamentWeeks || [] };
    await Store.set("settings", S.settings).catch(() => toast("Sauvegarde impossible")); toast("Semaine " + n + " enregistrée"); location.hash = "#accueil";
  };
  $("#set-restart").onclick = () => confirmSheet("Recommencer un cycle ?", "Tu repars en semaine 1 cette semaine.", "Recommencer", async () => {
    S.settings = { startDate: isoDate(mondayOf(new Date())), tournamentWeeks: [] };
    await Store.set("settings", S.settings).catch(() => {}); location.hash = "#accueil";
  });
}

window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden && T.h) tick(); });
(async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  await Store.init();
  if (Store.mode === "local" && !Store.lsGet("settings") && !Store.lsGet("seeded")) {
    // Point de départ : semaine 1 au 16/11/2026, séance A faite ce jour-là
    Store.lsSet("settings", { startDate: "2026-11-16", tournamentWeeks: [] });
    Store.lsSet("logs", [{ session: "A", date: "2026-11-16T18:00:00.000Z", week: 1, bloc: 1, deload: false, tournament: false, cycleStart: "2026-11-16", durationMin: 65, entries: {}, _id: "log-seed-a" }]);
    Store.lsSet("seeded", true);
  }
  if (Store.mode === "local" && !Store.lsGet("seedA2")) {
    // Charges de la séance A du 16/11/2026
    const S_ = (n, kg, reps) => Array.from({ length: n }, () => ({ kg, reps, done: true }));
    const entries = { boxjump: S_(4, null, null), squat: S_(4, 70, 8), bulgare: S_(3, 8, 12), rdl: S_(3, 60, 12), fentelat: S_(3, 16, 6), mollets: S_(3, null, null), pallof: S_(3, 6, 10) };
    const logs = Store.lsGet("logs") || [];
    const l = logs.find(x => x._id === "log-seed-a");
    if (l && !Object.keys(l.entries || {}).length) { l.entries = entries; Store.lsSet("logs", logs); }
    Store.lsSet("seedA2", true);
  }
  try {
    const [settings, current, tests, logs] = await Promise.all([Store.get("settings"), Store.get("current"), Store.get("tests"), Store.logs()]);
    S.comp = (await Store.get("comp")) || seedComp(); if (!(await Store.get("comp"))) Store.set("comp", S.comp);
    S.settings = settings; S.current = current; S.tests = tests || {}; S.logs = logs || [];
  } catch (e) { if (Store.mode === "db") S.loadError = true; }
  route();
})();
</script>
