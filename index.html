<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salle Padel</title>
<meta name="theme-color" content="#0E2236">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salle Padel">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --court: #0E2236;
  --court-2: #15314C;
  --court-3: #1D3F5F;
  --line: #2C5277;
  --chalk: #EEF3F7;
  --muted: #9DB2C6;
  --ball: #F4D13D;
  --ball-ink: #1A1A10;
  --good: #4FD39A;
  --warn: #FF9F5A;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--court); color: var(--chalk); font-family: var(--body); font-size: 16px; line-height: 1.4;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 150px); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: 34px; }
h2 { font-size: 24px; }
h3 { font-size: 19px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.week-head { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; position: relative; overflow: hidden; }
.week-head::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border: 2px solid var(--line); border-radius: 50%; opacity: .6; }
.eyebrow { font-family: var(--display); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ball); font-weight: 700; }
.big { font-family: var(--display); font-size: 52px; font-weight: 700; line-height: .9; }
.weeks { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 14px; }
.weeks span { height: 8px; border-radius: 3px; background: var(--court-3); }
.weeks span.done { background: var(--muted); }
.weeks span.now { background: var(--ball); }
.weeks span.deload { outline: 1px dashed var(--muted); outline-offset: 1px; }
.weeks-legend { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 12px; color: var(--muted); margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; background: var(--court-3); color: var(--chalk); }
.chip.ball { background: var(--ball); color: var(--ball-ink); }
.chip.good { background: rgba(79,211,154,.16); color: var(--good); }
.chip.warn { background: rgba(255,159,90,.16); color: var(--warn); }
.sess { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-decoration: none; color: inherit; }
.sess.next { border-color: var(--ball); box-shadow: 0 0 0 1px var(--ball) inset; }
.sess.skip { opacity: .55; }
.letter { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-size: 34px; font-weight: 700; background: var(--court-3); }
.sess.next .letter { background: var(--ball); color: var(--ball-ink); }
.arrow { font-size: 22px; color: var(--muted); }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 700; background: var(--court-3); color: var(--chalk); text-align: center; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--ball); color: var(--ball-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.back { color: var(--muted); text-decoration: none; font-weight: 600; }
.block-title { font-family: var(--display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 10px 0 -2px; }
.ex { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ex.complete { border-color: rgba(79,211,154,.55); }
.ex-head { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 14px 14px 10px; align-items: start; }
.ex-num { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--muted); line-height: 1.1; }
.ex.complete .ex-num { color: var(--good); }
.presc { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--ball); white-space: nowrap; text-align: right; line-height: 1.1; }
.presc small { display: block; font-family: var(--body); font-size: 12.5px; color: var(--muted); font-weight: 500; }
.ex-meta { padding: 0 14px 10px 54px; display: flex; flex-direction: column; gap: 6px; }
.last { font-size: 14px; color: var(--muted); }
.last b { color: var(--chalk); font-weight: 600; }
.hint { font-size: 14px; color: var(--good); font-weight: 600; }
details.how { border-top: 1px solid var(--line); }
details.how summary { list-style: none; padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::before { content: "+ "; color: var(--ball); }
details.how[open] summary::before { content: "− "; }
.how-body { padding: 0 14px 12px; font-size: 15px; display: flex; flex-direction: column; gap: 8px; }
.how-body ul { margin: 0; padding-left: 18px; }
.how-body a { color: var(--ball); font-weight: 600; }
.sets { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.set { display: grid; grid-template-columns: 34px 1fr 1fr 52px; gap: 8px; align-items: center; }
.set .lab { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); }
.set.done .lab { color: var(--good); }
.field { position: relative; }
.field input { width: 100%; background: var(--court); border: 1px solid var(--line); border-radius: 10px; padding: 11px 34px 11px 10px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.field input::placeholder { color: #5E7891; }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); pointer-events: none; }
.tick { width: 52px; height: 46px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--court); display: grid; place-items: center; font-size: 22px; font-weight: 700; color: transparent; }
.set.done .tick { background: var(--good); border-color: var(--good); color: #062A1B; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.cbox { height: 50px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--court); font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); }
.cbox.done { background: var(--good); border-color: var(--good); color: #062A1B; }
.warm { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); }
.warm summary { list-style: none; padding: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.warm summary::-webkit-details-marker { display: none; }
.warm-list { padding: 0 14px 12px; display: flex; flex-direction: column; }
.witem { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.witem .box { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 15px; color: transparent; font-weight: 700; }
.witem.done .box { background: var(--good); border-color: var(--good); color: #062A1B; }
.witem.done .wname { color: var(--muted); text-decoration: line-through; }
.wdose { font-size: 14px; color: var(--ball); font-weight: 600; white-space: nowrap; }
.wname { font-weight: 600; }
.wname small { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; text-decoration: none; }
.notice { border-radius: 12px; padding: 12px 14px; font-size: 14.5px; background: rgba(255,159,90,.12); border: 1px solid rgba(255,159,90,.4); }
.notice.info { background: var(--court-2); border-color: var(--line); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(14,34,54,.96); background: color-mix(in srgb, var(--court) 96%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.timer { display: none; max-width: 560px; margin: 0 auto; padding: 10px 16px; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
.timer.on { display: flex; }
.timer .t { font-family: var(--display); font-size: 36px; font-weight: 700; min-width: 92px; font-variant-numeric: tabular-nums; }
.timer.over .t { color: var(--good); }
.timer .lbl { flex: 1; font-size: 13.5px; color: var(--muted); line-height: 1.2; }
.bar { height: 3px; background: var(--ball); transform-origin: left; }
.tabs { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs a { text-align: center; padding: 10px 4px 12px; text-decoration: none; color: var(--muted); font-size: 12.5px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs a svg { width: 22px; height: 22px; }
.tabs a.on { color: var(--ball); }
.log { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); }
.log summary { list-style: none; padding: 12px 14px; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; cursor: pointer; }
.log summary::-webkit-details-marker { display: none; }
.log .letter { width: 40px; height: 40px; font-size: 24px; border-radius: 10px; }
.log-body { padding: 0 14px 14px; font-size: 14.5px; display: flex; flex-direction: column; gap: 6px; }
.log-body .l { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
.log-body .l span:last-child { color: var(--muted); text-align: right; }
select { font: inherit; color: var(--chalk); background: var(--court-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
.chart { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.chart svg { width: 100%; height: auto; display: block; }
.ttable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ttable th, .ttable td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ttable th { font-family: var(--display); font-size: 15px; color: var(--muted); font-weight: 700; }
.ttable td input { width: 100%; min-width: 0; background: var(--court); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; font-size: 15px; text-align: center; font-variant-numeric: tabular-nums; }
.ttable td.n { font-weight: 600; }
.ttable td.n small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
label.fld { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.sw { width: 52px; height: 30px; border-radius: 999px; background: var(--court-3); border: 0; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--chalk); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--ball); }
.sw[aria-checked="true"]::after { transform: translateX(22px); background: var(--ball-ink); }
.react { position: fixed; inset: 0; z-index: 40; background: var(--court); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
.react.on { display: flex; }
.react .r-arrow { font-size: min(52vw, 260px); line-height: 1; font-weight: 700; color: var(--ball); }
.react .r-arrow.flash { animation: rflash .25s ease-out; }
@keyframes rflash { from { transform: scale(.7); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.react.rest .r-arrow { color: var(--muted); font-size: 90px; }
.react .r-word { font-family: var(--display); font-size: 34px; font-weight: 700; min-height: 40px; }
.react .r-info { color: var(--muted); font-size: 15px; }
.react .r-time { font-family: var(--display); font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; }
.formbox { background: var(--court-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.formbox.fset { padding: 8px 12px; }
.forms { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.fbtn { background: var(--court); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 2px; color: var(--chalk); display: grid; justify-items: center; gap: 2px; font: inherit; }
.fbtn span { font-size: 22px; line-height: 1.1; }
.fbtn small { font-size: 11px; color: var(--muted); }
.fbtn.on { border-color: var(--ball); background: var(--court-3); }
.fbtn.on small { color: var(--ball); }
.formbox.fset .fbtn:not(.on) { opacity: .55; }
.wchart svg { width: 100%; height: auto; display: block; }
.modal { position: fixed; inset: 0; background: rgba(5,12,20,.7); display: none; align-items: flex-end; justify-content: center; z-index: 30; padding: 16px; }
.modal.on { display: flex; }
.sheet { background: var(--court-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; margin-bottom: env(safe-area-inset-bottom); max-height: calc(100dvh - 40px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--court-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg a { text-align: center; padding: 8px 4px; border-radius: 9px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: 14px; }
.seg a.on { background: var(--court-3); color: var(--chalk); }
.cgrid { display: flex; flex-wrap: wrap; gap: 6px; }
.cgrid .chip { border: 0; padding: 7px 12px; font: inherit; font-size: 13.5px; font-weight: 600; }
.jcard { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.res { font-family: var(--display); font-weight: 700; font-size: 18px; width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; }
.res.V { background: rgba(79,211,154,.18); color: var(--good); } .res.D { background: rgba(255,159,90,.18); color: var(--warn); }
.hbar { display: grid; grid-template-columns: 110px 1fr 24px; gap: 8px; align-items: center; font-size: 13.5px; }
.hbar i { display: block; height: 10px; border-radius: 5px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { background: var(--court-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.kpi b { display: block; font-family: var(--display); font-size: 28px; line-height: 1.1; }
.kpi span { color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); background: var(--good); color: #062A1B; font-weight: 700; padding: 10px 16px; border-radius: 999px; z-index: 40; display: none; }
.toast.on { display: block; }
.sync { font-size: 12.5px; color: var(--muted); text-align: center; }
.pweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.pday { background: var(--court-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 3px; min-height: 96px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pday.today { border-color: var(--ball); }
.pday.past { opacity: .5; }
.pd-h { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.1; }
.pd-h b { display: block; font-family: var(--display); font-size: 18px; color: var(--chalk); }
.pp { width: 100%; border: 0; border-radius: 6px; background: rgba(79,211,154,.16); color: var(--good); font-size: 10.5px; font-weight: 700; padding: 3px 1px; line-height: 1.15; }
.pp.hard { background: rgba(255,159,90,.18); color: var(--warn); }
.pp.easy { background: var(--court-3); color: var(--muted); }
.pp small { display: block; font-weight: 500; font-size: 10px; }
.pg { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--ball); color: var(--ball-ink); font-family: var(--display); font-weight: 700; font-size: 18px; text-decoration: none; margin-top: auto; }
.pg.done { background: var(--court-3); color: var(--good); font-size: 14px; width: auto; padding: 0 5px; }
.pr { font-size: 10.5px; color: var(--muted); margin-top: auto; }
/* Carte joueur */
.pcard { --c1: #E3A970; --c2: #9A5B2E; --ink: #2A1408; width: 230px; margin: 4px auto 0; padding: 18px 18px 26px; color: var(--ink); background: linear-gradient(155deg, var(--c1), var(--c2)); clip-path: polygon(50% 0, 100% 6%, 100% 86%, 50% 100%, 0 86%, 0 6%); position: relative; border: 0; display: block; font: inherit; text-align: left; }
.pcard.argent { --c1: #EEF1F4; --c2: #8E99A4; --ink: #1B2128; }
.pcard.or { --c1: #FBEA8C; --c2: #C08F27; --ink: #2B1E02; }
.pcard.elite { --c1: #2B2B33; --c2: #0B0B0E; --ink: #F3D46B; }
.pcard::before { content: ""; position: absolute; inset: 7px; clip-path: inherit; border: 1.5px solid rgba(255,255,255,.35); pointer-events: none; }
.pc-top { display: grid; grid-template-columns: 58px 1fr; gap: 6px; align-items: start; }
.pc-ovr { font-family: var(--display); font-size: 46px; font-weight: 700; line-height: .9; }
.pc-pos { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: .04em; }
.pc-flag { font-size: 18px; margin-top: 2px; }
.pc-art { display: grid; place-items: center; height: 104px; }
.pc-art svg { width: 92px; height: 104px; }
.pc-name { font-family: var(--display); font-size: 25px; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid currentColor; padding-bottom: 4px; margin: 4px 6px 8px; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; padding: 0 8px; }
.pc-stats div { display: flex; align-items: baseline; gap: 6px; font-family: var(--display); font-size: 19px; }
.pc-stats b { font-size: 22px; min-width: 26px; }
.pc-stats div.na { opacity: .45; }
.pc-stats i { font-style: normal; font-size: 12px; color: #12693F; font-weight: 700; }
.pcard.elite .pc-stats i { color: var(--good); }
.pc-foot { text-align: center; font-size: 11.5px; font-weight: 700; margin-top: 8px; opacity: .8; }
/* Réflexes */
.rx { position: fixed; inset: 0; z-index: 45; background: var(--court); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.rx.on { display: flex; }
.rx.go { background: var(--ball); color: var(--ball-ink); }
.rx.early { background: var(--warn); color: #2A1300; }
.rx-info { color: var(--muted); font-size: 15px; font-weight: 600; }
.rx.go .rx-info { color: inherit; opacity: .7; }
.rx-big { font-family: var(--display); font-size: min(30vw, 150px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.rx-big.arrow { font-size: min(60vw, 300px); }
.rx-txt { font-size: 17px; max-width: 340px; }
/* Raquettes */
.rk { background: var(--court-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.rk.main { border-color: var(--ball); }
.meter { height: 8px; border-radius: 4px; background: var(--court-3); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--good); }
.meter i.warn { background: var(--warn); }
/* Thèmes */
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.th { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 6px; font: inherit; }
.th.on { border-color: var(--ball); box-shadow: 0 0 0 1px var(--ball) inset; }
.th.locked { opacity: .55; }
.th .sw4 { display: flex; gap: 4px; }
.th .sw4 span { width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgba(255,255,255,.15); }
.th b { font-family: var(--display); font-size: 18px; }
.th small { font-size: 12px; opacity: .8; }
/* Détente vidéo */
.jv { position: fixed; inset: 0; z-index: 44; background: var(--court); display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.jv.on { display: block; }
.jv-in { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px); display: flex; flex-direction: column; gap: 12px; }
#jv-work { display: flex; flex-direction: column; gap: 10px; }
#jv-work[hidden] { display: none; }
#jv-v { width: 100%; max-height: 52vh; background: #000; border-radius: 12px; object-fit: contain; }
.jv-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.jv-steps .btn { padding: 14px 4px; font-size: 18px; }
.jv-marks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jv-marks small { display: block; font-weight: 500; font-size: 12px; opacity: .8; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

// Synchro Firebase (projet « les-mimichats », même compte que l'appli de couple).
// Firestore refuse les tableaux imbriqués : chaque valeur est stockée en texte JSON.
// localStorage reste toujours à jour : l'appli marche hors ligne et sans compte.
const Store = {
  mode: "local", db: null, auth: null, user: null, base: null, logsCol: null, syncError: null,
  async init() {
    if (typeof firebase === "undefined") return;
    try {
      firebase.apps.length || firebase.initializeApp(FB_CONFIG);
      this.auth = firebase.auth(); this.db = firebase.firestore();
      try { await this.db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
      const user = await new Promise(res => { const off = this.auth.onAuthStateChanged(u => { off(); res(u); }); setTimeout(() => res(this.auth.currentUser), 6000); });
      if (!user) return;
      this.user = user;
      this.base = this.db.collection("sallePadel").doc(user.uid).collection("data");
      this.logsCol = this.db.collection("sallePadel").doc(user.uid).collection("logs");
      const probe = await this.withTimeout(this.base.doc("settings").get());
      this.mode = "db";
      if (!probe.exists && this.lsGet("settings")) await this.upload();
    } catch (e) {
      this.mode = "local";
      this.syncError = e && (e.code === "permission-denied" || e.code === "firestore/permission-denied") ? "rules" : e && e.code === "timeout" ? "offline" : "other";
    }
  },
  // Premier branchement : envoie tout ce qui est sur le téléphone vers le compte
  async upload() {
    const batch = this.db.batch();
    for (const k of SYNC_KEYS) { const v = this.lsGet(k); if (v != null) batch.set(this.base.doc(k), { json: JSON.stringify(v), at: Date.now() }); }
    for (const l of this.lsGet("logs") || []) { const { _id, ...log } = l; batch.set(this.logsCol.doc(_id || "log-" + Date.parse(l.date)), { date: log.date, json: JSON.stringify(log) }); }
    await this.withTimeout(batch.commit());
  },
  lsGet(k) { try { return JSON.parse(localStorage.getItem("padelapp2:" + k)); } catch (e) { return null; } },
  lsSet(k, v) { try { v == null ? localStorage.removeItem("padelapp2:" + k) : localStorage.setItem("padelapp2:" + k, JSON.stringify(v)); } catch (e) {} },
  withTimeout(p, ms = 10000) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]); },
  async get(k) {
    if (this.mode === "db") {
      try { const s = await this.withTimeout(this.base.doc(k).get()); const v = s.exists ? JSON.parse(s.data().json) : null; this.lsSet(k, v); return v; }
      catch (e) { return this.lsGet(k); }
    }
    return this.lsGet(k);
  },
  queues: {},
  set(k, v) {
    this.lsSet(k, v);
    if (this.mode !== "db") return Promise.resolve();
    const prev = this.queues[k] || Promise.resolve();
    // set() est appliqué tout de suite au cache hors ligne ; on n'attend pas le serveur
    const run = prev.catch(() => {}).then(() => { const w = v == null ? this.base.doc(k).delete() : this.base.doc(k).set({ json: JSON.stringify(v), at: Date.now() }); w.catch(() => {}); });
    this.queues[k] = run; return run;
  },
  async logs() {
    if (this.mode === "db") {
      try {
        const q = await this.withTimeout(this.logsCol.orderBy("date", "desc").limit(500).get());
        const list = q.docs.map(d => ({ ...JSON.parse(d.data().json), _id: d.id })); this.lsSet("logs", list); return list;
      } catch (e) {}
    }
    return (this.lsGet("logs") || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  },
  async addLog(log) {
    const id = "log-" + Date.now();
    const l = this.lsGet("logs") || []; l.push({ ...log, _id: id }); this.lsSet("logs", l);
    if (this.mode === "db") this.logsCol.doc(id).set({ date: log.date, json: JSON.stringify(log) }).catch(() => {});
    return id;
  },
  async delLog(id) {
    this.lsSet("logs", (this.lsGet("logs") || []).filter(l => l._id !== id));
    if (this.mode === "db") this.logsCol.doc(id).delete().catch(() => {});
  }
};

function weekInfo(date = new Date()) {
  if (!S.settings?.startDate) return null;
  const start = parseISO(S.settings.startDate);
  const w = Math.floor((mondayOf(date) - mondayOf(start)) / (7 * DAY)) + 1;
  const week = Math.max(1, w);
  const cw = Math.min(week, 12);
  const bloc = Math.min(2, Math.floor((cw - 1) / 4));
  const iso = isoDate(date), mon = isoDate(mondayOf(date));
  const padelWeek = Array.from({ length: 7 }, (_, i) => padelMin(plusDays(mon, i))).reduce((a, b) => a + b, 0);
  const fatigue = padelMin(iso) >= 90 || padelMin(plusDays(iso, -1)) >= 120;
  const form = S.current?.form ?? null, lowForm = form != null && form <= 2;
  return { week, cw, bloc, deload: cw % 4 === 0, over: week > 12, notStarted: w < 1, tournament: (S.settings.tournamentWeeks || []).includes(week) || compTournamentWeek(date), padelWeek, fatigue, form, lowForm };
}
function presc(ex, wi) {
  let sets = ex.sets[wi.bloc];
  if (ex.kind !== "interval") {
    if (wi.deload) sets = Math.max(2, Math.round(sets * 0.6));
    if (wi.tournament) sets = Math.max(1, Math.ceil(sets / 2));
    const home = ex.id.startsWith("m-");
    if (((wi.fatigue && !home) || wi.lowForm) && !wi.deload && !wi.tournament) sets = Math.max(2, sets - 1);
    if (wi.form === 1) sets = Math.max(1, sets - 1);
  } else {
    if (wi.lowForm) sets = Math.max(4, Math.round(sets * 0.6));
    else if (wi.deload || wi.tournament) sets = Math.max(4, Math.round(sets * (wi.tournament ? 0.5 : 0.6)));
    else if (wi.padelWeek >= 180) sets = Math.max(4, Math.round(sets * 0.5));
  }
  return { sets, reps: ex.reps[wi.bloc] };
}
function lastFor(exId) {
  for (const l of S.logs) { const e = l.entries?.[exId]; if (e && e.some(s => s.done)) return { log: l, sets: e }; }
  return null;
}
function doneThisWeek(wi) {
  const set = new Set();
  for (const l of S.logs) if (l.week === wi.week && l.cycleStart === S.settings.startDate && ORDER.includes(l.session)) set.add(l.session);

}

function route() {

  if (S.loadError) return renderError();
  if (!S.settings?.startDate && h !== "reglages") return renderOnboarding();
  window.scrollTo(0, 0);
  checkUnlocks();
  if (h.startsWith("seance-")) { setTab(""); return renderSession(h.slice(7).toUpperCase()); }
  if (h === "historique") { setTab(h); return renderHistory(); }
  if (h === "journal") { setTab("historique"); return renderJournal(); }
  if (h === "bilan") { setTab("historique"); return renderBilan(); }
  if (h === "tests") { setTab(h); return renderTests(); }
  if (h === "competition") { setTab(h); return renderComp(); }
  if (h === "reglages") { setTab(h); return renderSettings(); }
  setTab("accueil"); renderHome();
}

function renderError() {
  app.innerHTML = `<div class="stack"><h1>Salle Padel</h1><div class="notice">Impossible de charger tes données pour l'instant. Vérifie ta connexion, puis rouvre la page.</div></div>`;
}

function renderOnboarding() {
  setTab("");
  const opts = Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">Semaine ${i + 1}${(i + 1) % 4 === 0 ? " (allégée)" : ""}</option>`).join("");
  app.innerHTML = `
  <div class="stack">
    <div class="eyebrow">Programme 12 semaines</div>
    <h1>On cale ton programme</h1>
    <p class="muted">Dis-moi où tu en es cette semaine. L'appli calcule ensuite toute seule ton bloc, les semaines allégées et ce qui t'attend à chaque séance.</p>
    <label class="fld" for="ob-week">Cette semaine, je suis en
      <select id="ob-week">${opts}</select>
    </label>
    <button class="btn primary block" id="ob-go" type="button">C'est parti</button>
  </div>`;
  $("#ob-go").onclick = async () => {
    const n = +$("#ob-week").value;
    const start = new Date(mondayOf(new Date()).getTime() - (n - 1) * 7 * DAY);
    S.settings = { startDate: isoDate(start), tournamentWeeks: [] };
    await Store.set("settings", S.settings).catch(() => toast("Sauvegarde impossible"));
    location.hash = "#accueil"; route();
  };
}

function weekBar(wi) {
  const cells = Array.from({ length: 12 }, (_, i) => {
    const n = i + 1; const cls = [n < wi.cw ? "done" : "", n === wi.cw ? "now" : "", n % 4 === 0 ? "deload" : ""].join(" ");
    return `<span class="${cls}" title="Semaine ${n}"></span>`;
  }).join("");
  return `<div class="weeks" aria-hidden="true">${cells}</div><div class="weeks-legend"><span>Base</span><span>Force</span><span>Puissance</span></div>`;
}

/* ------------------------------------------------------------------ PADEL PRÉVU (matchs, entraînements, cours) */
const PTYPES = { match: "Match", entrainement: "Entraînement", cours: "Cours", tournoi: "Tournoi" };
const EASY = p => p.int === "facile";
const HARD = p => p.type === "tournoi" || (p.type === "match" && !EASY(p));
const INT_W = { facile: 0.5, normal: 1, intense: 1.3 };
const LOAD = p => (+p.dur || 0) * (p.type === "tournoi" ? 1.3 : INT_W[p.int || "normal"] || 1);
const WD = ["lun.", "mar.", "mer.", "jeu.", "ven.", "sam.", "dim."];
const durLabel = m => m >= 60 ? Math.floor(m / 60) + " h" + (m % 60 ? String(m % 60).padStart(2, "0") : "") : m + " min";
// Tout le padel d'un jour : séances notées (ponctuelles ou chaque semaine) + tournois du calendrier Compét
function padelOn(iso) {
  const d = parseISO(iso), wd = (d.getDay() + 6) % 7, out = [];
  for (const p of S.padel || []) {
    if (p.weekly) { if (p.wd === wd && iso >= p.date && !(p.skip || []).includes(iso)) out.push({ ...p, occ: iso }); }
    else if (p.date === iso) out.push({ ...p, occ: iso });
  }
  for (const t of [...(S.comp?.upcoming || []), ...(S.comp?.results || [])]) if (t.date === iso) out.push({ id: "t-" + t.id, type: "tournoi", dur: 300, label: t.cat + (t.name ? " · " + t.name : ""), fromComp: true, occ: iso });
  return out.sort((a, b) => (a.time || "").localeCompare(b.time || ""));
}
const padelMin = iso => padelOn(iso).reduce((s, p) => s + LOAD(p), 0); // minutes « pondérées » par l'intensité
const hardOn = iso => padelOn(iso).some(HARD);
const plusDays = (iso, n) => isoDate(new Date(parseISO(iso).getTime() + n * DAY));

// Ce qui est conseillé pour une séance un jour donné : { ok: false, why } si à éviter, { pen, why } sinon
function sessionFit(k, iso) {
  const today = padelOn(iso), tom = padelOn(plusDays(iso, 1)), after = padelOn(plusDays(iso, 2)), yest = padelMin(plusDays(iso, -1));
  const loadToday = today.reduce((s, p) => s + LOAD(p), 0);
  const tomReal = tom.filter(p => !EASY(p)), tomEasy = tom.filter(EASY);
  const name = l => l.map(p => PTYPES[p.type].toLowerCase() + (EASY(p) ? " tranquille" : "")).join(" + ");
  if (today.some(p => p.type === "tournoi")) return { ok: false, why: "jour de tournoi" };
  if (k === "M") return tom.some(p => p.type === "tournoi") ? { ok: true, pen: 3, why: "tournoi demain : fais juste l'équilibre et la balle au mur" } : { ok: true, pen: 0, why: "" };
  if (k === "A") {
    if (tomReal.length) return { ok: false, why: `${name(tomReal)} demain : garde 48 h entre jambes lourdes et padel` };
    if (today.some(HARD)) return { ok: false, why: "match le même jour" };
    let pen = 0, why = "";
    if (tomEasy.length) { pen += 2; why = `${name(tomEasy)} demain, ça passe mais tes jambes seront lourdes`; }
    if (after.some(HARD)) { pen += 4; why = why || "match dans 2 jours, c'est juste"; }
    if (loadToday) { pen += loadToday >= 60 ? 4 : 2; why = why || "padel le même jour"; }
    if (yest >= 90) { pen += 2; why = why || "grosse séance de padel la veille"; }
    return { ok: true, pen, why };
  }
  if (k === "C") {
    if (tom.some(HARD)) return { ok: false, why: "match demain : pas de sauts ni de sprints la veille" };
    if (today.some(HARD)) return { ok: false, why: "match le même jour" };
    let pen = 0, why = "";
    if (tomReal.length) { pen += 3; why = `${name(tomReal)} demain`; } else if (tomEasy.length) { pen += 1; why = `${name(tomEasy)} demain`; }
    if (loadToday) { pen += loadToday >= 60 ? 3 : 1; why = why || "padel le même jour"; }
    return { ok: true, pen, why };
  }
  // B : haut du corps, possible la veille d'un match
  let pen = 0, why = "";
  if (loadToday > 60) { pen += 3; why = "padel le même jour"; } else if (loadToday) { pen += 1; why = "padel tranquille le même jour"; }
  if (today.some(HARD)) { pen += 3; why = "match le même jour"; }
  return { ok: true, pen, why };
}

// Répartit les séances restantes sur les jours restants de la semaine, en respectant le padel.
function planWeek(wi) {
  const mon = isoDate(mondayOf(new Date())), todayIso = isoDate(new Date());
  const days = Array.from({ length: 7 }, (_, i) => plusDays(mon, i));
  const done = doneThisWeek(wi);
  const doneDay = {}; for (const l of S.logs) if (l.week === wi.week && l.cycleStart === S.settings.startDate && ORDER.includes(l.session)) doneDay[isoDate(new Date(l.date))] = l.session;
  let todo = ORDER.filter(k => !done.has(k) && !(wi.tournament && k === "A"));
  const free = days.filter(d => d >= todayIso && !doneDay[d]);
  const fixed = {}; if (S.current && todo.includes(S.current.session)) { fixed[todayIso] = S.current.session; todo = todo.filter(k => k !== S.current.session); }
  const avail = free.filter(d => !fixed[d]);
  let best = null;
  const gymDays = a => ({ ...doneDayMap(doneDay), ...fixed, ...a });
  function score(a) {
    let s = 0; const all = gymDays(a);
    for (const [d, k] of Object.entries(a)) {
      const f = sessionFit(k, d); s += f.pen;
      if (all[plusDays(d, -1)]) s += 2; if (all[plusDays(d, 1)]) s += 2;
      s += (days.indexOf(d) - days.indexOf(todayIso)) * 0.05; // plutôt tôt que tard
    }
    const seq = Object.entries(a).sort().map(e => e[1]).join("");
    if (seq !== ORDER.filter(k => seq.includes(k)).join("")) s += 0.5;
    return s;
  }
  function rec(i, a, used) {
    if (i === todo.length) { const n = Object.keys(a).length, sc = score(a); if (!best || n > best.n || (n === best.n && sc < best.sc)) best = { a: { ...a }, n, sc }; return; }
    rec(i + 1, a, used); // séance non placée (cas où rien ne colle)
    for (const d of avail) if (!used.has(d) && sessionFit(todo[i], d).ok) { a[d] = todo[i]; used.add(d); rec(i + 1, a, used); delete a[d]; used.delete(d); }
  }
  rec(0, {}, new Set());
  const plan = { ...fixed, ...(best ? best.a : {}) };
  const unplaced = todo.filter(k => !Object.values(plan).includes(k));
  return { days, plan, doneDay, unplaced, todayIso };
}
function doneDayMap(m) { return Object.fromEntries(Object.entries(m)); }

function padelWeekHtml(wi) {
  const P = planWeek(wi); const total = P.days.reduce((s, d) => s + padelOn(d).reduce((t, p) => t + (+p.dur || 0), 0), 0);
  const cells = P.days.map((d, i) => {
    const pad = padelOn(d), gym = P.doneDay[d] || P.plan[d], past = d < P.todayIso, isToday = d === P.todayIso;
    return `<div class="pday ${isToday ? "today" : ""} ${past ? "past" : ""}">
      <div class="pd-h">${WD[i]}<b>${parseISO(d).getDate()}</b></div>
      ${pad.map(p => `<button class="pp ${HARD(p) ? "hard" : ""} ${EASY(p) ? "easy" : ""}" type="button" ${p.fromComp ? `onclick="location.hash='#competition'"` : `data-pad="${p.id}" data-occ="${d}"`}>${{ match: "Match", entrainement: "Entraîn.", cours: "Cours", tournoi: "Tournoi" }[p.type]}<small>${p.type === "tournoi" ? "" : durLabel(+p.dur) + (EASY(p) ? " · cool" : p.int === "intense" ? " · dur" : "")}</small></button>`).join("")}
      ${gym ? `<a class="pg ${P.doneDay[d] ? "done" : ""}" href="#seance-${gym.toLowerCase()}">${gym}${P.doneDay[d] ? " ✓" : ""}</a>` : !pad.length && !past && !homeOn(d) ? `<span class="pr">repos</span>` : ""}
      ${homeOn(d) ? `<a class="pg done" href="#historique">M ✓</a>` : ""}
    </div>`;
  }).join("");
  const tip = P.unplaced.length ? `<div class="notice small">Pas de bon créneau cette semaine pour la séance ${P.unplaced.join(" et ")} avec ton padel prévu. Saute-la, ou fais-la en allégeant.</div>` : "";
  return { html: `<div class="row between"><h2>Ta semaine</h2><button class="btn sm" id="pad-add" type="button">+ Padel</button></div>
    <div class="pweek">${cells}</div>
    <p class="small muted" style="margin:-4px 0 0">${total ? `${durLabel(total)} de padel prévues. ` : ""}Les lettres A, B, C sont les séances de salle placées en fonction de ton padel.${wi.padelWeek >= 180 ? " Tu fais beaucoup de padel : le cardio de la séance C est réduit." : ""}</p>${tip}`, P };
}

function padelSheet(p = {}, occ) {
  const types = Object.entries(PTYPES).filter(([k]) => k !== "tournoi");
  openSheet(`<h2>${p.id ? "Modifier" : "Padel prévu"}</h2>
    <div class="row wrap" id="pt">${types.map(([k, l]) => `<button type="button" class="chip ${(p.type || "match") === k ? "ball" : ""}" data-t="${k}" style="border:0;padding:8px 14px">${l}</button>`).join("")}</div>
    <div class="row"><label class="fld" style="flex:1">Jour<input id="pd-d" type="date" value="${p.date || isoDate(new Date())}" style="background:var(--court);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;color:var(--chalk)"></label>
    <label class="fld" style="width:120px">Heure<input id="pd-h" type="time" value="${p.time || "19:00"}" style="background:var(--court);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;color:var(--chalk)"></label></div>
    <div class="fld">Intensité<div class="row wrap" id="pi">${[["facile", "Tranquille"], ["normal", "Normale"], ["intense", "À fond"]].map(([k, l]) => `<button type="button" class="chip ${(p.int || "normal") === k ? "ball" : ""}" data-i="${k}" style="border:0;padding:8px 14px">${l}</button>`).join("")}</div>
      <span class="small muted" style="font-weight:400">Tranquille : partenaires moins forts, échanges cool. Compte pour moitié dans la fatigue.</span></div>
    <label class="fld">Durée<select id="pd-m">${[60, 90, 120, 150, 180].map(m => `<option value="${m}" ${(+p.dur || 90) === m ? "selected" : ""}>${durLabel(m)}</option>`).join("")}</select></label>
    <label class="toggle" style="padding:10px 14px"><span><b>Toutes les semaines</b><span class="small muted" style="display:block">Même jour, même heure</span></span><input id="pd-w" type="checkbox" ${p.weekly ? "checked" : ""} style="width:24px;height:24px"></label>
    ${p.id ? `<div class="row wrap">${p.weekly && occ ? `<button class="btn sm ghost" id="pd-skip" type="button">Annuler juste le ${frDate(occ)}</button>` : ""}<button class="btn sm danger" id="pd-del" type="button">Supprimer${p.weekly ? " toutes les semaines" : ""}</button></div>` : ""}`, async () => {
    const date = $("#pd-d").value; if (!date) { toast("Choisis un jour"); return false; }
    const type = $("#pt .chip.ball")?.dataset.t || "match";
    const item = { id: p.id || "pd" + Date.now(), type, int: $("#pi .chip.ball")?.dataset.i || "normal", date, time: $("#pd-h").value, dur: +$("#pd-m").value, weekly: $("#pd-w").checked, wd: (parseISO(date).getDay() + 6) % 7, skip: p.skip || [] };
    S.padel = (S.padel || []).filter(x => x.id !== item.id); S.padel.push(item);
    await Store.set("padel", S.padel).catch(() => toast("Sauvegarde impossible")); toast(PTYPES[type] + " ajouté");
  }, renderHome);
  $("#pi").onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; $("#pi").querySelectorAll(".chip").forEach(c => c.classList.toggle("ball", c === b)); };
  $("#pt").onclick = e => { const b = e.target.closest("[data-t]"); if (!b) return; $("#pt").querySelectorAll(".chip").forEach(c => c.classList.toggle("ball", c === b)); };
  const del = $("#pd-del"); if (del) del.onclick = async () => { S.padel = S.padel.filter(x => x.id !== p.id); await Store.set("padel", S.padel).catch(() => {}); $("#modal").classList.remove("on"); renderHome(); };
  const sk = $("#pd-skip"); if (sk) sk.onclick = async () => { const x = S.padel.find(x => x.id === p.id); x.skip = [...(x.skip || []), occ]; await Store.set("padel", S.padel).catch(() => {}); $("#modal").classList.remove("on"); renderHome(); };
}

function renderHome() {
  const wi = weekInfo();
  const done = doneThisWeek(wi);
  const order = ORDER.filter(k => !(wi.tournament && k === "A"));
  const PW = padelWeekHtml(wi), P = PW.P;
  const upcoming = Object.entries(P.plan).sort((a, b) => a[0].localeCompare(b[0]));
  const next = upcoming[0]?.[1] || order.find(k => !done.has(k));
  const nextDay = upcoming[0]?.[0];
  const LONG = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  const when = d => d === plusDays(P.todayIso, 1) ? "demain" : LONG[(parseISO(d).getDay() + 6) % 7];
  const headTxt = S.current ? "Reprends ta séance"
    : P.plan[P.todayIso] ? "Aujourd'hui : séance " + P.plan[P.todayIso]
    : P.doneDay[P.todayIso] ? (nextDay ? `Séance ${P.doneDay[P.todayIso]} faite · ensuite ${next} ${when(nextDay)}` : `Séance ${P.doneDay[P.todayIso]} faite, semaine bouclée`)
    : nextDay ? `Repos aujourd'hui · séance ${next} ${when(nextDay)}`
    : done.size >= order.length ? "Semaine bouclée" : "Prochaine : séance " + next;
  const chips = [];
  if (wi.deload) chips.push(`<span class="chip warn">Semaine allégée · −40 % de séries</span>`);
  if (wi.tournament) chips.push(`<span class="chip warn">Semaine de tournoi</span>`);
  if (S.current) chips.push(`<span class="chip ball">Séance ${S.current.session} en cours</span>`);
  const cards = ORDER.map(k => {
    const p = PROGRAM[k]; const isDone = done.has(k); const skip = wi.tournament && k === "A";
    const status = S.current?.session === k ? `<span class="chip ball">En cours</span>` : isDone ? `<span class="chip good">Faite</span>` : skip ? `<span class="chip">À sauter</span>` : `<span class="arrow">›</span>`;
    return `<a class="sess ${k === next && !S.current ? "next" : ""} ${skip ? "skip" : ""}" href="#seance-${k.toLowerCase()}">
      <div class="letter">${k}</div>
      <div><h3>${p.sub}</h3><div class="small muted">${p.dur}</div></div>
      ${status}</a>`;
  }).join("");
  const recent = S.logs.slice(0, 3).map(l => `<div class="row between small"><span>${frDate(l.date)} · Séance ${l.session}</span><span class="muted">S${l.week}${l.durationMin ? " · " + l.durationMin + " min" : ""}</span></div>`).join("");
  app.innerHTML = `
  <div class="stack">
    ${wi.over ? `<div class="notice">Tes 12 semaines sont terminées. Fais tes tests de la semaine 12, puis lance le cycle ${cycleNo() + 1} : ${(cycleNo() + 1) % 2 === 0 ? "quelques exercices changent pour relancer la progression, " : "retour aux exercices du cycle 1, "}tes charges repartent de tes dernières séances.<button class="btn primary block" id="next-cycle" type="button" style="margin-top:10px">Lancer le cycle ${cycleNo() + 1}</button></div>` : ""}
    <section class="week-head">
      <div class="eyebrow">${cycleNo() > 1 ? "Cycle " + cycleNo() + " · " : ""}Bloc ${wi.bloc + 1} · ${BLOCS[wi.bloc]}</div>
      <div class="row" style="align-items:baseline;gap:8px;margin-top:6px"><span class="big num">S${wi.cw}</span><span class="muted">/ 12</span></div>
      ${weekBar(wi)}
      ${chips.length ? `<div class="row wrap" style="margin-top:12px">${chips.join("")}</div>` : ""}
    </section>
    ${healthHtml()}
    ${PW.html}
    ${(() => { const today = padelOn(P.todayIso); const m = today.find(p => p.type === "match" || p.type === "tournoi");
      return `<div class="row"><button class="btn ${m ? "primary" : "ghost"}" id="prematch" type="button" style="flex:1">🔥 Avant-match<small style="display:block;font-weight:500;font-size:12px">8 min</small></button><button class="btn ghost" id="postmatch" type="button" style="flex:1">🧘 Récup après<small style="display:block;font-weight:500;font-size:12px">8 min</small></button></div>`; })()}
    ${(() => { const t = matchToNote(); return t ? `<button class="notice info small" id="note-match" type="button" style="text-align:left;color:inherit;font:inherit;width:100%">📝 Note ton ${t.type === "tournoi" ? "tournoi" : "match"} ${t.date === P.todayIso ? "d'aujourd'hui" : frDate(t.date)} : ce qui a marché, ce qui a coincé (30 s) ›</button>` : ""; })()}
    ${gripNotice()}
    ${!weekWeight() ? `<a class="notice info small" href="#tests" style="display:block;text-decoration:none;color:inherit">⚖️ Pense à ta pesée de la semaine (prise de masse) ›</a>` : ""}
    <div class="row between"><h2>${headTxt}</h2><span class="small muted">${done.size}/${order.length} faites</span></div>
    ${cards}
    ${(() => { const h = homeThisWeek(), m = PROGRAM.M; return `<a class="sess" href="#seance-m">
      <div class="letter">M</div>
      <div><h3>${m.sub}</h3><div class="small muted">${m.dur} · ${h}/${HOME_TARGET} cette semaine</div></div>
      ${S.current?.session === "M" ? `<span class="chip ball">En cours</span>` : h >= HOME_TARGET ? `<span class="chip good">${h} faite${h > 1 ? "s" : ""}</span>` : `<span class="arrow">›</span>`}</a>`; })()}
    ${wi.deload ? `<div class="notice info small">Semaine allégée : mêmes exercices et mêmes charges, moins de séries. C'est aussi la semaine des tests.</div>` : ""}
    <div class="toggle"><div><b>Semaine de tournoi</b><div class="small muted">Saute la séance A, B et C à moitié du volume.</div></div><button class="sw" id="tw" role="switch" aria-checked="${wi.tournament}" aria-label="Semaine de tournoi"></button></div>
    ${recent ? `<div class="stack" style="gap:6px"><h3>Dernières séances</h3>${recent}</div>` : ""}
    <p class="sync">${Store.mode === "db" ? "Synchronisé sur ton compte, sur tous tes appareils." : "Sauvegarde sur cet appareil uniquement."}</p>
  </div>`;
  syncReminders(); bindHealth();
  $("#pad-add").onclick = () => padelSheet();
  $("#prematch").onclick = () => startGuided(PREMATCH, "Échauffé, bon match !");
  $("#postmatch").onclick = () => startGuided(POSTMATCH, "Récup terminée. Pense à noter ton match !");
  const nm = $("#note-match"); if (nm) nm.onclick = () => { const t = matchToNote(); journalSheet({ date: t.date, type: t.type }); };
  const nc = $("#next-cycle"); if (nc) nc.onclick = () => newCycle();
  app.querySelectorAll("[data-pad]").forEach(b => b.onclick = () => padelSheet(S.padel.find(x => x.id === b.dataset.pad), b.dataset.occ));
  $("#tw").onclick = async () => {
    const tw = new Set(S.settings.tournamentWeeks || []);
    tw.has(wi.week) ? tw.delete(wi.week) : tw.add(wi.week);
    S.settings = { ...S.settings, tournamentWeeks: [...tw] };
    renderHome(); Store.set("settings", S.settings).catch(() => toast("Sauvegarde impossible"));
  };
}

let saveT = null;
function saveCurrent() { clearTimeout(saveT); saveT = setTimeout(() => Store.set("current", S.current).catch(() => toast("Sauvegarde impossible")), 1000); }
function ensureCurrent(key) {
  if (!S.current) { S.current = { session: key, startedAt: Date.now(), entries: {}, warm: [] }; }
  return S.current;
}

function renderSession(key) {
  const p = PROGRAM[key]; if (!p) { location.hash = "#accueil"; return; }
  if (S.current && S.current.session !== key) {
    app.innerHTML = `<div class="stack"><a class="back" href="#accueil">‹ Semaine</a>
      <h1>Séance ${S.current.session} en cours</h1>
      <p class="muted">Tu as déjà commencé la séance ${S.current.session}. Termine-la ou abandonne-la avant d'ouvrir la séance ${key}.</p>
      <a class="btn primary block" href="#seance-${S.current.session.toLowerCase()}">Reprendre la séance ${S.current.session}</a>
      <button class="btn danger block" id="abandon" type="button">Abandonner la séance ${S.current.session}</button></div>`;

    return;
  }
  const wi = weekInfo();

  const warm = cur?.warm || [];

    ${(() => { const f = sessionFit(key, isoDate(new Date())); return !f.ok ? `<div class="notice small"><b>À éviter aujourd'hui</b> : ${esc(f.why)}. Regarde « Ta semaine » pour le meilleur jour.</div>` : f.pen >= 3 ? `<div class="notice small">Attention : ${esc(f.why)}. Écoute tes jambes et garde de la marge.</div>` : ""; })()}

      <div class="warm-list">${WU.map((w, i) => `<button class="witem ${warm[i] ? "done" : ""}" data-w="${i}" type="button"><span class="box">✓</span><span class="wname">${esc(w[0])}<small>${esc(w[2])}</small></span><span class="wdose">${esc(w[1])}</span></button>`).join("")}</div>

}

const FORMS = [[1, "😫", "Cuit"], [2, "😕", "Bof"], [3, "🙂", "Correct"], [4, "😀", "Bien"], [5, "💪", "Au top"]];
function formHtml(cur) {
  const f = cur?.form;
  return `<div class="formbox ${f ? "fset" : ""}"><div class="small ${f ? "muted" : ""}"><b>${f ? "Forme du jour" : "Comment tu te sens ?"}</b>${f ? "" : " Sommeil, courbatures, énergie : la séance s'adapte."}</div>
    <div class="forms">${FORMS.map(([n, e, l]) => `<button type="button" class="fbtn ${f === n ? "on" : ""}" data-form="${n}" aria-pressed="${f === n}"><span>${e}</span><small>${l}</small></button>`).join("")}</div></div>`;
}

function exCard(ex, n, wi, cur) {
  const pr = presc(ex, wi);
  const entries = cur?.entries?.[ex.id] || [];
  const last = lastFor(ex.id);
  const complete = entries.filter(s => s?.done).length >= pr.sets;
  let lastTxt = "", hint = "", sugKg = null;
  if (last && (ex.kind === "load" || ex.kind === "bw")) {
    const ds = last.sets.filter(s => s.done);
    const kgs = ds.map(s => s.kg).filter(v => v != null);
    const top = kgs.length ? Math.max(...kgs) : null;
    const reps = ds.map(s => s.reps ?? "–").join("/");
    lastTxt = `Dernière fois (${frDate(last.log.date)}) : <b>${top != null ? fmt(top) + " kg" : ex.kind === "bw" ? "poids du corps" : "–"}</b>${ex.noReps ? "" : " · " + reps + " rép."}`;
    const rr = repRange(pr.reps);
    if (rr && !ex.noReps && ds.length >= last.sets.length && ds.length && ds.every(s => (s.reps ?? 0) >= rr.hi)) {
      if (!(ex.kind === "bw" && top == null)) sugKg = (top || 0) + ex.inc;
      hint = ex.kind === "bw" && top == null ? `Tu as tout fait à ${rr.hi} rép. : ajoute du lest ou vise plus.` : `Tout validé à ${rr.hi} rép. : monte à ${fmt((top || 0) + ex.inc)} kg.`;
    }
  }

    const boxes = Array.from({ length: pr.sets }, (_, i) => `<button class="cbox ${entries[i]?.done ? "done" : ""}" data-ex="${ex.id}" data-i="${i}" type="button" aria-pressed="${!!entries[i]?.done}">${ex.kind === "interval" ? i + 1 : "S" + (i + 1)}</button>`).join("");
    setsHtml = ex.kind === "react"
      ? `<button class="btn primary block" data-react="${ex.id}" type="button">Lancer les signaux · ${pr.sets} × ${esc(pr.reps)}</button><div class="checks">${boxes}</div>`
      : ex.kind === "interval"
      ? `<button class="btn primary block" data-interval="${ex.id}" type="button">Lancer le chrono · ${pr.sets} × ${esc(pr.reps)}</button><div class="checks">${boxes}</div>`
      : `<div class="checks">${boxes}</div>`;
  } else {
    const lastSets = last?.sets || [];
    const rr = repRange(pr.reps);
    setsHtml = Array.from({ length: pr.sets }, (_, i) => {
      const e = entries[i] || {}; const ls = lastSets[i] || lastSets[lastSets.length - 1] || {};
      const phKg = sugKg != null ? fmt(sugKg) : ls.kg != null ? fmt(ls.kg) : (ex.kind === "bw" ? "0" : "");
      const phReps = sugKg != null && rr ? rr.lo : ls.reps != null ? ls.reps : rr ? rr.lo : "";
      return `<div class="set ${e.done ? "done" : ""}" data-row="${ex.id}-${i}">
        <span class="lab">S${i + 1}</span>
        <div class="field"><input id="kg-${ex.id}-${i}" inputmode="decimal" placeholder="${phKg}" value="${e.kg != null ? fmt(e.kg) : ""}" data-ex="${ex.id}" data-i="${i}" data-f="kg" aria-label="${ex.kind === "bw" ? "Lest" : "Charge"} série ${i + 1}"><span>${ex.kind === "bw" ? "lest" : "kg"}</span></div>
        ${ex.noReps ? `<div class="small muted">${esc(pr.reps)}</div>` : `<div class="field"><input id="rp-${ex.id}-${i}" inputmode="numeric" placeholder="${phReps}" value="${e.reps ?? ""}" data-ex="${ex.id}" data-i="${i}" data-f="reps" aria-label="Répétitions série ${i + 1}"><span>rép.</span></div>`}
        <button class="tick" data-ex="${ex.id}" data-i="${i}" type="button" aria-label="Valider la série ${i + 1}" aria-pressed="${!!e.done}">✓</button>
      </div>`;

  const blocNote = ex.bloc ? `<p><b>Cette semaine :</b> ${esc(ex.bloc[wi.bloc])}</p>` : "";
  return `<article class="ex ${complete ? "complete" : ""}" id="ex-${ex.id}">
    <div class="ex-head"><span class="ex-num">${n}</span><div><h3>${esc(ex.name)}</h3>${ex.why ? `<div class="small muted">${esc(ex.why)}</div>` : ""}</div>
      <div class="presc">${pr.sets} × ${esc(pr.reps)}<small>${ex.unit ? esc(ex.unit) + " · " : ""}${ex.rest ? "repos " + restLabel(ex.rest) : ""}</small></div></div>
    ${lastTxt || hint || ex.bloc ? `<div class="ex-meta">${lastTxt ? `<div class="last">${lastTxt}</div>` : ""}${hint ? `<div class="hint">${hint}</div>` : ""}${ex.bloc && !lastTxt ? `<div class="last">${esc(ex.bloc[wi.bloc])}</div>` : ""}</div>` : ""}
    <details class="how"><summary>Comment faire</summary><div class="how-body"><p style="margin:0">${esc(ex.how)}</p>${ex.setup ? `<p style="margin:0"><b>Mise en place :</b> ${esc(ex.setup)}</p>` : ""}${(() => { const st = [...(ex.variants || []).slice(0, pr.sets).map((v, i) => `${i + 1}${i ? "e" : "re"} série : ${v}`), ...(ex.steps || [])]; return st.length ? `<ol style="margin:0;padding-left:20px;display:grid;gap:6px">${st.map(c => `<li>${esc(c)}</li>`).join("")}</ol>` : ""; })()}${ex.feel ? `<p style="margin:0"><b>Tu dois sentir :</b> ${esc(ex.feel)}</p>` : ""}${ex.cues?.length ? `${ex.steps || ex.variants ? "<b>Points clés :</b>" : ""}<ul>${ex.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}${blocNote}${ex.video ? `<a href="${ex.video}" target="_blank" rel="noopener">Voir une vidéo de démo ›</a>` : ""}</div></details>
    <div class="sets">${setsHtml}</div>
  </article>`;
}

function findEx(key, id) { return allItems(key).find(e => e.id === id); }

function bindSession(key) {
  const wi = weekInfo();
  app.querySelectorAll(".witem").forEach(b => b.onclick = () => {
    const c = ensureCurrent(key); const i = +b.dataset.w; c.warm[i] = !c.warm[i];
    b.classList.toggle("done", !!c.warm[i]);
    const WU = PROGRAM[key].warmup || WARMUP;
    const d = WU.filter((_, j) => c.warm[j]).length; const wc = $("#wcount"); wc.textContent = d + "/" + WU.length; wc.classList.toggle("good", d === WU.length);
    saveCurrent();
  });
  app.querySelectorAll("input[data-ex]").forEach(inp => inp.oninput = () => {
    const c = ensureCurrent(key); const { ex, i, f } = inp.dataset;
    c.entries[ex] = c.entries[ex] || []; c.entries[ex][i] = c.entries[ex][i] || {};
    c.entries[ex][i][f] = f === "reps" ? (num(inp.value) == null ? null : Math.round(num(inp.value))) : num(inp.value);
    saveCurrent();
  });
  app.querySelectorAll(".tick").forEach(b => b.onclick = () => {
    unlockAudio();
    const c = ensureCurrent(key); const { ex, i } = b.dataset; const exo = findEx(key, ex);
    c.entries[ex] = c.entries[ex] || []; const e = c.entries[ex][i] = c.entries[ex][i] || {};
    e.done = !e.done;

      if (e.kg == null && kgIn && kgIn.placeholder !== "") { e.kg = num(kgIn.placeholder); kgIn.value = kgIn.placeholder; }
      if (rpIn && e.reps == null && rpIn.placeholder !== "") { e.reps = Math.round(num(rpIn.placeholder)); rpIn.value = rpIn.placeholder; }
      if (exo.kind === "bw" && e.kg == null) e.kg = 0;

    afterTick(key, exo, wi, e.done); saveCurrent();
  });
  app.querySelectorAll(".cbox").forEach(b => b.onclick = () => {
    unlockAudio();
    const c = ensureCurrent(key); const { ex, i } = b.dataset; const exo = findEx(key, ex);
    c.entries[ex] = c.entries[ex] || []; const e = c.entries[ex][i] = c.entries[ex][i] || {};
    e.done = !e.done; b.classList.toggle("done", e.done); b.setAttribute("aria-pressed", e.done);
    if (exo.kind !== "interval") afterTick(key, exo, wi, e.done); else markComplete(exo, wi);
    saveCurrent();
  });
  app.querySelectorAll("[data-form]").forEach(b => b.onclick = () => { const c = ensureCurrent(key); const n = +b.dataset.form; c.form = c.form === n ? null : n; saveCurrent(); Store.set("current", S.current).catch(() => {}); const y = window.scrollY; renderSession(key); window.scrollTo(0, y); });
  app.querySelectorAll("[data-react]").forEach(b => b.onclick = () => { unlockAudio(); ensureCurrent(key); startReact(findEx(key, b.dataset.react), wi); });
  app.querySelectorAll("[data-interval]").forEach(b => b.onclick = () => { unlockAudio(); ensureCurrent(key); startIntervals(key, findEx(key, b.dataset.interval), wi); });
  $("#finish").onclick = () => finishSession(key);
  const ab = $("#abandon"); if (ab) ab.onclick = () => confirmSheet("Abandonner la séance ?", "Ce que tu as noté sera perdu.", "Abandonner", async () => { S.current = null; stopTimer(); stopReact(); await Store.set("current", null).catch(() => {}); location.hash = "#accueil"; });
}

function markComplete(ex, wi) {
  const pr = presc(ex, wi); const n = (S.current.entries[ex.id] || []).filter(s => s?.done).length;
  const card = $("#ex-" + ex.id); if (card) card.classList.toggle("complete", n >= pr.sets);
  return n >= pr.sets;
}
function afterTick(key, ex, wi, done) {
  const complete = markComplete(ex, wi);
  if (!done || !ex.rest) return;
  const items = sessItems(key); const idx = items.findIndex(e => e.id === ex.id);
  const nextEx = complete ? items[idx + 1] : null;
  startTimer(ex.rest, complete ? (nextEx ? "Ensuite : " + nextEx.name : "Dernier exercice terminé") : "Repos · " + ex.name);
}

let audio = null;
function unlockAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { audio = null; } }
function beep(at = 0, f = 880, d = .18) {
  if (!audio) return;
  try { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    const t = audio.currentTime + at; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.start(t); o.stop(t + d + .05); } catch (e) {}
}
const T = { end: 0, total: 0, h: null, label: "", phases: null, pi: 0, onPhase: null };
function startTimer(sec, label) {
  T.phases = null; T.total = sec; T.end = Date.now() + sec * 1000; T.label = label; T.beeped = false;
  $("#tlbl").textContent = label; $("#timer").classList.add("on"); $("#tplus").style.display = "";
  tick(); clearInterval(T.h); T.h = setInterval(tick, 250);
}
function tick() {
  const left = (T.end - Date.now()) / 1000;
  if (T.phases) {
    if (left <= 0) { T.pi++; if (T.pi >= T.phases.length) { beep(0, 660, .5); stopTimer(); toast("Intervalles terminés"); return; } runPhase(); return; }
    if (left <= 3.05 && !T.cd?.[Math.ceil(left)]) { T.cd = T.cd || {}; T.cd[Math.ceil(left)] = 1; beep(0, 520, .08); }
  } else if (left <= 0 && !T.beeped) { T.beeped = true; beep(0); beep(.25); beep(.5, 1100, .3); $("#timer").classList.add("over"); $("#tlbl").textContent = "C'est reparti !"; }
  $("#tval").textContent = (left < 0 && !T.phases ? "+" : "") + mmss(Math.abs(left));
  $("#tbar").style.transform = `scaleX(${Math.max(0, Math.min(1, left / T.total))})`;
  if (!T.phases && left < -60) stopTimer();
}
function stopTimer() { clearInterval(T.h); T.phases = null; $("#timer").classList.remove("on", "over"); $("#tbar").style.transform = "scaleX(0)"; }
$("#tplus").onclick = () => { T.end += 15000; T.total += 15; $("#timer").classList.remove("over"); T.beeped = false; $("#tlbl").textContent = T.label; tick(); };
$("#tskip").onclick = () => stopTimer();

function startIntervals(key, ex, wi) {
  const pr = presc(ex, wi);
  const [on, off] = pr.reps.match(/\d+/g).map(Number);
  const phases = [{ s: 10, l: "Prépare-toi" }];
  for (let i = 0; i < pr.sets; i++) { phases.push({ s: on, l: `Effort ${i + 1}/${pr.sets} · à fond`, work: i }); if (i < pr.sets - 1) phases.push({ s: off, l: `Récup · encore ${pr.sets - i - 1}` }); }
  T.phases = phases; T.pi = 0; T.key = key; T.ex = ex; T.wi = wi;
  $("#timer").classList.add("on"); $("#timer").classList.remove("over"); $("#tplus").style.display = "none";
  runPhase(); clearInterval(T.h); T.h = setInterval(tick, 200);
}
function runPhase() {
  const ph = T.phases[T.pi]; T.total = ph.s; T.end = Date.now() + ph.s * 1000; T.cd = {};
  $("#tlbl").textContent = ph.l; beep(0, ph.work != null ? 1100 : 700, .25);
  if (T.pi > 0) { const prev = T.phases[T.pi - 1]; if (prev.work != null && S.current) {
    const c = S.current; c.entries[T.ex.id] = c.entries[T.ex.id] || []; c.entries[T.ex.id][prev.work] = { done: true };
    const b = app.querySelector(`.cbox[data-ex="${T.ex.id}"][data-i="${prev.work}"]`); if (b) { b.classList.add("done"); b.setAttribute("aria-pressed", "true"); }
    markComplete(T.ex, T.wi); saveCurrent(); } }
  tick();
}

/* ------------------------------------------------------------------ RÉACTION (flèches aléatoires) */
const DIRS4 = [["↑", "Avance · volée"], ["↓", "Recule · lob"], ["←", "Gauche"], ["→", "Droite"]];
const DIRS8 = [...DIRS4, ["↖", "Volée gauche"], ["↗", "Volée droite"], ["↙", "Vitre gauche"], ["↘", "Vitre droite"]];
const R = { h: null, ex: null, wi: null, sets: 0, set: 0, phase: "", end: 0, next: 0, last: -1, n: 0, lock: null };
function startReact(ex, wi) {
  stopTimer();
  const pr = presc(ex, wi);
  Object.assign(R, { ex, wi, sets: pr.sets, set: 0, work: parseInt(pr.reps) || 20, rest: ex.rest || 40,
    dirs: wi.bloc === 0 ? DIRS4 : DIRS8, gap: wi.bloc === 2 ? [1.1, 1.8] : [1.5, 2.5] });
  $("#react").classList.add("on");
  try { navigator.wakeLock?.request("screen").then(l => R.lock = l).catch(() => {}); } catch (e) {}
  reactPhase("prep", 5);
  clearInterval(R.h); R.h = setInterval(reactTick, 100);
}
function reactPhase(ph, sec) {
  R.phase = ph; R.end = Date.now() + sec * 1000; R.cd = {};
  const el = $("#react"); el.classList.toggle("rest", ph !== "work");
  if (ph === "work") { R.n = 0; R.next = Date.now() + 600; $("#r-arrow").textContent = "●"; $("#r-word").textContent = "Rebonds…"; beep(0, 1100, .25); }
  else { $("#r-arrow").textContent = "⏸"; $("#r-word").textContent = ph === "prep" ? "Place-toi face au téléphone" : "Récup · marche"; }
  $("#r-info").textContent = ph === "work" ? `Série ${R.set + 1} / ${R.sets}` : ph === "prep" ? "Prépare-toi" : `Série ${R.set + 1} / ${R.sets} ensuite`;
}
function reactTick() {
  const now = Date.now(), left = (R.end - now) / 1000;
  $("#r-time").textContent = Math.max(0, Math.ceil(left)) + " s";
  if (R.phase !== "work" && left <= 3.05 && left > 0 && !R.cd[Math.ceil(left)]) { R.cd[Math.ceil(left)] = 1; beep(0, 520, .08); }
  if (R.phase === "work" && now >= R.next && left > 0.8) {
    let i; do { i = Math.floor(Math.random() * R.dirs.length); } while (i === R.last && R.dirs.length > 1);
    R.last = i; R.n++;
    const a = $("#r-arrow"); a.textContent = R.dirs[i][0]; a.classList.remove("flash"); void a.offsetWidth; a.classList.add("flash");
    $("#r-word").textContent = R.dirs[i][1]; beep(0, 950, .12);
    R.next = now + (R.gap[0] + Math.random() * (R.gap[1] - R.gap[0])) * 1000;
  }
  if (left > 0) return;
  if (R.phase === "work") {
    if (S.current) { const c = S.current; c.entries[R.ex.id] = c.entries[R.ex.id] || []; c.entries[R.ex.id][R.set] = { done: true };
      const b = app.querySelector(`.cbox[data-ex="${R.ex.id}"][data-i="${R.set}"]`); if (b) { b.classList.add("done"); b.setAttribute("aria-pressed", "true"); }
      markComplete(R.ex, R.wi); saveCurrent(); }
    R.set++;
    if (R.set >= R.sets) { beep(0, 660, .5); stopReact(); toast(`Réaction terminée`); return; }
    beep(0, 700, .25); reactPhase("rest", R.rest);
  } else reactPhase("work", R.work);
}
function startGuided(steps, doneMsg = "Terminé !") {
  stopTimer(); stopReact(); unlockAudio();
  Object.assign(R, { guided: steps, gi: -1 });
  $("#react").classList.add("on", "rest");
  try { navigator.wakeLock?.request("screen").then(l => R.lock = l).catch(() => {}); } catch (e) {}
  const total = steps.reduce((a, s) => a + s[1], 0);
  const next = () => {
    R.gi++; if (R.gi >= steps.length) { beep(0, 660, .5); beep(.3, 880, .5); stopReact(); toast(doneMsg); return; }
    const [n, sec, d] = steps[R.gi]; R.end = Date.now() + sec * 1000; R.cd = {};
    $("#r-info").textContent = `Étape ${R.gi + 1} / ${steps.length} · ${Math.round(total / 60)} min au total`;
    $("#r-arrow").textContent = R.gi + 1; $("#r-word").innerHTML = `${esc(n)}<div class="small muted" style="font-family:var(--body);font-weight:400;font-size:16px;max-width:420px;margin:10px auto 0">${esc(d)}</div>`;
    beep(0, 1000, .2);
  };
  clearInterval(R.h); next();
  R.h = setInterval(() => {
    const left = (R.end - Date.now()) / 1000;
    $("#r-time").textContent = mmss(Math.max(0, left));
    if (left <= 3.05 && left > 0 && !R.cd[Math.ceil(left)]) { R.cd[Math.ceil(left)] = 1; beep(0, 520, .08); }
    if (left <= 0) next();
  }, 200);
}
function stopReact() { clearInterval(R.h); R.h = null; $("#react").classList.remove("on", "rest"); R.guided = null; try { R.lock?.release(); } catch (e) {} R.lock = null; }
$("#r-stop").onclick = () => stopReact();
$("#r-skip").onclick = () => { R.end = Date.now(); };

function finishSession(key) {
  const c = S.current;
  const any = c && Object.values(c.entries).some(a => a.some(s => s?.done));
  if (!any) { toast("Valide au moins une série avant de terminer"); return; }
  const wi = weekInfo();
  const items = sessItems(key);
  const missing = items.filter(ex => (c.entries[ex.id] || []).filter(s => s?.done).length < presc(ex, wi).sets).length;
  confirmSheet("Terminer la séance " + key + " ?", missing ? `${missing} exercice${missing > 1 ? "s" : ""} pas complètement validé${missing > 1 ? "s" : ""}. Elle sera quand même enregistrée.` : "Tout est validé. Bien joué.", "Enregistrer", async () => {
    const clean = {};
    for (const [k, arr] of Object.entries(c.entries)) clean[k] = (arr || []).map(s => ({ kg: s?.kg ?? null, reps: s?.reps ?? null, done: !!s?.done }));
    const log = { session: key, date: new Date().toISOString(), week: wi.week, bloc: wi.bloc + 1, deload: wi.deload, tournament: wi.tournament,
      cycleStart: S.settings.startDate, cycle: cycleNo(), form: c.form ?? null, durationMin: Math.max(1, Math.round((Date.now() - c.startedAt) / 60000)), entries: clean };
    try {
      const id = await Store.addLog(log);
      S.logs.unshift({ ...log, _id: id }); S.current = null; stopTimer(); stopReact();
      await Store.set("current", null).catch(() => {});
      toast("Séance " + key + " enregistrée"); location.hash = "#accueil";
    } catch (e) { toast("Enregistrement impossible, réessaie"); }
  });
}

function confirmSheet(title, text, okLabel, onOk) {
  $("#sheet").innerHTML = `<h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(text)}</p><button class="btn primary block" id="m-ok" type="button">${esc(okLabel)}</button><button class="btn ghost block" id="m-no" type="button">Annuler</button>`;
  $("#modal").classList.add("on");
  const close = () => $("#modal").classList.remove("on");
  $("#m-no").onclick = close; $("#modal").onclick = e => { if (e.target.id === "modal") close(); };
  $("#m-ok").onclick = async () => { close(); await onOk(); };
}

let chartEx = "squat";

function drawChart() {
  const pts = S.logs.slice().reverse().map(l => {
    const e = (l.entries?.[chartEx] || []).filter(s => s.done && s.kg != null);
    return e.length ? { d: new Date(l.date), v: Math.max(...e.map(s => s.kg)) } : null;
  }).filter(Boolean);
  const el = $("#chart");
  if (pts.length < 2) { el.innerHTML = `<p class="muted small" style="margin:6px">${pts.length ? "Une seule séance notée (" + fmt(pts[0].v) + " kg). La courbe apparaît dès la deuxième." : "Pas encore de charge notée sur cet exercice."}</p>`; return; }
  const W = 340, H = 170, pl = 36, pr = 14, pt = 14, pb = 26;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs); if (hi === lo) { hi += 5; lo = Math.max(0, lo - 5); }
  const pad = (hi - lo) * .15; lo = Math.max(0, lo - pad); hi += pad;
  const x = i => pl + (W - pl - pr) * (i / (pts.length - 1)); const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo, (lo + hi) / 2, hi].map(v => Math.round(v));
  const line = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const area = line + ` L${x(pts.length - 1).toFixed(1)} ${H - pb} L${pl} ${H - pb} Z`;
  const L = pts[pts.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la charge">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="${CV.line}" stroke-width="1"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="${CV.muted}">${t}</text>`).join("")}
    <path d="${area}" fill="${CV.ballSoft}"/><path d="${line}" fill="none" stroke="${CV.ball}" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 5 : 2.5}" fill="${CV.ball}"/>`).join("")}
    <text x="${pl}" y="${H - 8}" font-size="11" fill="${CV.muted}">${pts[0].d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</text>
    <text x="${W - pr}" y="${H - 8}" font-size="11" fill="${CV.muted}" text-anchor="end">${L.d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} · ${fmt(L.v)} kg</text>
  </svg>`;
}

let testT = null;
function weekWeight() { const mon = isoDate(mondayOf(new Date())); return (S.weights || []).find(w => w.date >= mon); }
function weightTrend() {
  const w = (S.weights || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (w.length < 3) return null;
  const last = w[w.length - 1], ref = w.find(x => (parseISO(last.date) - parseISO(x.date)) / DAY <= 35) || w[0];
  const weeks = (parseISO(last.date) - parseISO(ref.date)) / (7 * DAY); if (weeks < 2) return null;
  return (last.kg - ref.kg) / weeks;
}
function weightHtml() {
  const ww = weekWeight(), t = weightTrend();
  const msg = t == null ? "La tendance apparaît après 3 pesées. Pèse-toi le même jour chaque semaine, le matin à jeun."
    : t < 0.1 ? `<b>${fmt(Math.round(t * 100) / 100)} kg/semaine</b> : tu stagnes. Pour prendre du muscle, il faut manger un peu plus : ajoute une collation (fromage blanc, œufs, banane + poignée d'amandes) ou ressers-toi au dîner.`
    : t <= 0.5 ? `<b>+${fmt(Math.round(t * 100) / 100)} kg/semaine</b> : bon rythme de prise de masse, continue comme ça.`
    : `<b>+${fmt(Math.round(t * 100) / 100)} kg/semaine</b> : ça monte vite. Surveille le tour de taille, tu peux réduire un peu les portions.`;
  return `<section class="stack" style="gap:8px">
    <h2>Pesée de la semaine</h2>
    <div class="row"><div class="field" style="flex:1"><input id="w-kg" inputmode="decimal" placeholder="${ww ? fmt(ww.kg) : (S.weights || []).length ? fmt(S.weights[S.weights.length - 1].kg) : "kg"}" value="${ww ? fmt(ww.kg) : ""}" aria-label="Poids en kg"><span>kg</span></div>

    <div class="notice info small">${msg}</div>
  </section>`;
}
function drawWeights() {

  const x = i => pl + (W - pl - pr) * (i / (pts.length - 1)); const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));

}

function histSeg(on) {
  return `<nav class="seg">${[["historique", "Salle"], ["journal", "Matchs"], ["bilan", "Bilan"]].map(([h, l]) => `<a href="#${h}" class="${h === on ? "on" : ""}">${l}</a>`).join("")}</nav>`;

function saveJournal() { return Store.set("journal", S.journal).catch(() => toast("Sauvegarde impossible")); }
// Un match / tournoi joué récemment (aujourd'hui ou les 3 jours d'avant) et pas encore noté
function matchToNote() {
  const today = isoDate(new Date());
  for (let i = 0; i <= 3; i++) {
    const d = plusDays(today, -i);
    const ps = padelOn(d).filter(p => p.type === "match" || p.type === "tournoi");
    if (!ps.length) continue;
    if (d === today && ps.every(p => p.time && p.time > new Date().toTimeString().slice(0, 5))) continue;
    if (!(S.journal || []).some(j => j.date === d)) return { date: d, type: ps[0].type };
  }
  return null;
}

function countCoups(list, k) {
  const m = {}; for (const j of list) for (const c of j[k] || []) m[c] = (m[c] || 0) + 1;
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}

// L'appli calcule les rappels des 8 prochains jours et les dépose dans Firebase ;
// la fonction « rappelsSallePadel » (projet les-mimichats) les envoie à l'heure prévue.
const at = (iso, hm) => { const [y, m, d] = iso.split("-").map(Number); const [h, mi] = hm.split(":").map(Number); return new Date(y, m - 1, d, h, mi).getTime(); };
